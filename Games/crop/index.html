<!-- LIVETUTOR SYNC BRIDGE -->
<script>
    window.isSimulating = false;
    const urlParams = new URLSearchParams(window.location.search || window.location.hash.replace('#', '?'));
    const roomId = urlParams.get('room') || '54321';
    let localSeed = 0;
    
    window.setSeed = function(str) {
        let tempSeed = 0;
        for (let i = 0; i < str.length; i++) { tempSeed = str.charCodeAt(i) + ((tempSeed << 5) - tempSeed); }
        localSeed = Math.abs(tempSeed);
    };
    window.setSeed(roomId);
    
    window.seededRandom = function() {
        let x = Math.sin(localSeed++) * 10000;
        return x - Math.floor(x);
    };

    function getUniqueSelector(el) {
        if (!el) return null;
        if (el.id) return '#' + el.id;
        if (el === document.body) return 'body';
        let path = [];
        while (el && el.nodeType === Node.ELEMENT_NODE) {
            let selector = el.nodeName.toLowerCase();
            if (el.id) { selector = '#' + el.id; path.unshift(selector); break; } 
            else {
                if (el.className && typeof el.className === 'string') {
                    const classes = Array.from(el.classList).filter(c => !c.includes(':') && !c.includes('[') && !c.includes('/')).join('.');
                    if (classes) selector += '.' + classes;
                }
                let sibling = el, nth = 1;
                while (sibling = sibling.previousElementSibling) { if (sibling.nodeName.toLowerCase() === el.nodeName.toLowerCase()) nth++; }
                selector += ':nth-of-type(' + nth + ')';
                path.unshift(selector);
            }
            el = el.parentNode;
        }
        return path.join(' > ');
    }

    let actionIdCounter = 0;
    document.addEventListener('click', (e) => {
        if (e.isTrusted === false || window.isSimulating) return;
        const selector = getUniqueSelector(e.target); if (!selector) return;
        actionIdCounter++;
        window.parent.postMessage({
            type: 'IFRAME_ACTION_TRIGGERED',
            payload: { type: 'UNIVERSAL_CLICK', selector: selector, seed: localSeed, actionId: 'click_' + actionIdCounter + '_' + Date.now() }
        }, '*');
    }, true);

    let lastCursorTime = 0;
    document.addEventListener('mousemove', (e) => {
        const now = Date.now(); if (now - lastCursorTime < 40) return; lastCursorTime = now;
        window.parent.postMessage({ type: 'IFRAME_ACTION_TRIGGERED', payload: { type: 'UNIVERSAL_CURSOR', pctX: (e.clientX / window.innerWidth) * 100, pctY: (e.clientY / window.innerHeight) * 100 } }, '*');
    });

    let lastProcessedActionId = null;
    window.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'EXECUTE_UNIVERSAL_ACTION') {
            const action = event.data.action;
            if (action.type === 'UNIVERSAL_CURSOR') {
                const c = document.getElementById('remote-cursor');
                if (c) {
                    c.style.left = (action.pctX / 100 * window.innerWidth) + 'px';
                    c.style.top = (action.pctY / 100 * window.innerHeight) + 'px';
                    c.style.display = 'block';
                }
                return;
            }
            const currentActionId = action.actionId || action.timestamp;
            if (currentActionId && currentActionId === lastProcessedActionId) return;
            lastProcessedActionId = currentActionId;

            window.isSimulating = true;
            if (action.seed !== undefined) localSeed = action.seed;
            
            if (action.type === 'UNIVERSAL_CLICK') {
                const element = document.querySelector(action.selector);
                if (element) element.click();
            }
            setTimeout(() => { window.isSimulating = false; }, 50);
        }
    });
</script>

<style>

<script>
let currentActiveScreen = 'library';

// NO DEMO IMAGES: Clean empty initial array
let db = [];

// Active Playing State
let activePlayPuzzle = null;
let selectedPieceId = null;
let placedCount = 0;

// Creator State
let creatorCurrentPuzzle = {
    id: "",
    name: "",
    url: "",
    storagePath: "",
    pieces: []
};

let isDrawingLasso = false;
let currentLassoPoints = [];

// Web Audio API
let audioCtx = null;
function getAC() { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }
function playTone(freq, type, duration, vol=0.2) {
    try {
        const ac = getAC();
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.connect(gain); gain.connect(ac.destination);
        osc.type = type; osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, ac.currentTime);
        gain.gain.linearRampToValueAtTime(vol, ac.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
        osc.start(ac.currentTime); osc.stop(ac.currentTime + duration + 0.05);
    } catch(e) {}
}

// 1. BOOT & JSON FETCH
async function initDatabase() {
    try {
        const res = await fetch('./puzzles.json');
        if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data) && data.length) db = data;
        }
    } catch(e) {}
    
    renderLibraryDropdown();
    if (db.length) {
        loadPlayPuzzle(db[0].id);
    } else {
        showScreen('creator');
    }
}

// 2. SCREEN NAVIGATION
function showScreen(screen) {
    currentActiveScreen = screen;
    document.getElementById('screen-library').classList.toggle('hidden', screen !== 'library');
    document.getElementById('screen-creator').classList.toggle('hidden', screen !== 'creator');

    document.getElementById('nav-btn-library').classList.toggle('bg-amber-500', screen === 'library');
    document.getElementById('nav-btn-library').classList.toggle('text-slate-950', screen === 'library');
    document.getElementById('nav-btn-library').classList.toggle('bg-slate-800', screen !== 'library');
    document.getElementById('nav-btn-library').classList.toggle('text-slate-200', screen !== 'library');

    document.getElementById('nav-btn-creator').classList.toggle('bg-amber-500', screen === 'creator');
    document.getElementById('nav-btn-creator').classList.toggle('text-slate-950', screen === 'creator');
    document.getElementById('nav-btn-creator').classList.toggle('bg-slate-800', screen !== 'creator');
    document.getElementById('nav-btn-creator').classList.toggle('text-slate-200', screen !== 'creator');

    if (screen === 'library') {
        document.getElementById('active-title-label').innerText = activePlayPuzzle ? activePlayPuzzle.name : 'Library';
        if (activePlayPuzzle) renderPlayBoard();
    } else {
        document.getElementById('active-title-label').innerText = 'Lasso Creator Studio';
        setupLassoCanvas();
    }
}

// ========================================================
// SECTION 2: LASSO CUTTING STUDIO
// ========================================================
function handleCreatorImageUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    const originalName = file.name;
    const reader = new FileReader();

    reader.onload = (e) => {
        // Fresh reset: previous cuts will never leak
        creatorCurrentPuzzle = {
            id: 'puz_' + Date.now(),
            name: originalName,
            url: e.target.result,
            storagePath: `images/${originalName}`,
            pieces: []
        };

        document.getElementById('creator-img-path').value = creatorCurrentPuzzle.storagePath;
        const img = document.getElementById('creator-base-img');
        img.src = creatorCurrentPuzzle.url;
        img.onload = () => {
            setupLassoCanvas();
            renderCreatorLassoCutIndicators();
        };

        alert(`"${originalName}" loaded! Drag on the image to draw your custom lasso cut.`);
    };

    reader.readAsDataURL(file);
    event.target.value = '';
}

function setupLassoCanvas() {
    const canvas = document.getElementById('lasso-canvas');
    const img = document.getElementById('creator-base-img');
    const vp = document.getElementById('creator-viewport');
    
    if (!creatorCurrentPuzzle.url) {
        canvas.style.display = 'none';
        return;
    }
    
    canvas.style.display = 'block';
    canvas.width = vp.clientWidth;
    canvas.height = vp.clientHeight;
    
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    canvas.onmousedown = (e) => {
        isDrawingLasso = true;
        const rect = canvas.getBoundingClientRect();
        currentLassoPoints = [{
            x: ((e.clientX - rect.left) / rect.width) * 100,
            y: ((e.clientY - rect.top) / rect.height) * 100
        }];
    };

    canvas.onmousemove = (e) => {
        if (!isDrawingLasso) return;
        const rect = canvas.getBoundingClientRect();
        currentLassoPoints.push({
            x: ((e.clientX - rect.left) / rect.width) * 100,
            y: ((e.clientY - rect.top) / rect.height) * 100
        });
        drawLassoPreview(ctx, canvas);
    };

    window.onmouseup = () => {
        if (!isDrawingLasso) return;
        isDrawingLasso = false;
        
        if (currentLassoPoints.length > 5) {
            commitLassoPieceCut();
        }
        currentLassoPoints = [];
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    };
}

function drawLassoPreview(ctx, canvas) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (currentLassoPoints.length < 2) return;

    ctx.save();
    ctx.beginPath();
    ctx.moveTo((currentLassoPoints[0].x / 100) * canvas.width, (currentLassoPoints[0].y / 100) * canvas.height);
    for (let i = 1; i < currentLassoPoints.length; i++) {
        ctx.lineTo((currentLassoPoints[i].x / 100) * canvas.width, (currentLassoPoints[i].y / 100) * canvas.height);
    }
    ctx.closePath();
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([6, 3]);
    ctx.stroke();
    ctx.fillStyle = 'rgba(56, 189, 248, 0.25)';
    ctx.fill();
    ctx.restore();
}

function commitLassoPieceCut() {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    currentLassoPoints.forEach(p => {
        if (p.x < minX) minX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.x > maxX) maxX = p.x;
        if (p.y > maxY) maxY = p.y;
    });

    const w = Math.max(3, maxX - minX);
    const h = Math.max(3, maxY - minY);

    // Compute path points relative to the bounding box
    const relativeClipPoints = currentLassoPoints.map(p => ({
        x: +((p.x - minX) / w * 100).toFixed(1),
        y: +((p.y - minY) / h * 100).toFixed(1)
    }));

    const clipPathStr = `polygon(${relativeClipPoints.map(p => `${p.x}\%${p.y}%`).join(', ')})`;

    const pieceId = `pc_${Date.now()}_${creatorCurrentPuzzle.pieces.length + 1}`;
    creatorCurrentPuzzle.pieces.push({
        id: pieceId,
        box: {
            xPct: +minX.toFixed(2),
            yPct: +minY.toFixed(2),
            wPct: +w.toFixed(2),
            hPct: +h.toFixed(2)
        },
        clipPath: clipPathStr
    });

    playTone(680, 'triangle', 0.14);
    renderCreatorLassoCutIndicators();
}

function renderCreatorLassoCutIndicators() {
    const container = document.getElementById('creator-cut-holes');
    container.innerHTML = creatorCurrentPuzzle.pieces.map((p, idx) => `
        <div style="
            position: absolute;
            left: ${p.box.xPct}%;
            top: ${p.box.yPct}%;
            width: ${p.box.wPct}%;
            height: ${p.box.hPct}%;
            clip-path: ${p.clipPath};
            background: rgba(251, 191, 36, 0.45);
            border: 2px dashed #fbbf24;
            display: flex;
            align-items: center;
            justify-content: center;
        ">
            <span class="bg-slate-900/90 text-amber-300 text-[10px] font-bold px-1 rounded">#${idx + 1}</span>
        </div>
    `).join('');
}

function clearCurrentLassoCuts() {
    creatorCurrentPuzzle.pieces = [];
    renderCreatorLassoCutIndicators();
}

function saveCurrentCutsToDatabase() {
    if (!creatorCurrentPuzzle.url) return alert("Please upload an image first!");
    if (!creatorCurrentPuzzle.pieces.length) return alert("Please draw at least 1 lasso cut piece!");

    const finalPath = document.getElementById('creator-img-path').value.trim() || creatorCurrentPuzzle.storagePath;

    const savedItem = {
        id: creatorCurrentPuzzle.id,
        name: creatorCurrentPuzzle.name,
        url: finalPath,
        previewData: creatorCurrentPuzzle.url,
        pieces: JSON.parse(JSON.stringify(creatorCurrentPuzzle.pieces))
    };

    db = db.filter(p => p.name !== savedItem.name);
    db.push(savedItem);

    renderLibraryDropdown();
    loadPlayPuzzle(savedItem.id);
    showScreen('library');
    alert(`"${savedItem.name}" saved successfully into JSON dataset!`);
}

// ========================================================
// SECTION 1: LIBRARY PLAY WITH GREEN / RED FEEDBACK
// ========================================================
function renderLibraryDropdown() {
    const sel = document.getElementById('library-puz-select');
    if (!db.length) {
        sel.innerHTML = '<option value="">(No Puzzles in JSON)</option>';
        return;
    }
    sel.innerHTML = db.map(p => `<option value="${p.id}" ${activePlayPuzzle?.id === p.id ? 'selected' : ''}>${p.name}</option>`).join('');
}

function selectLibraryPuzzle(id) {
    loadPlayPuzzle(id);
}

function loadPlayPuzzle(id) {
    activePlayPuzzle = db.find(p => p.id === id);
    if (!activePlayPuzzle) return;

    document.getElementById('active-title-label').innerText = activePlayPuzzle.name;
    const img = document.getElementById('main-play-img');
    img.src = activePlayPuzzle.previewData || activePlayPuzzle.url;

    img.onload = () => {
        renderPlayBoard();
    };
}

function renderPlayBoard() {
    const holes = document.getElementById('play-holes-container');
    const placed = document.getElementById('play-placed-container');
    const tray = document.getElementById('bottom-tray');

    holes.innerHTML = ''; placed.innerHTML = ''; tray.innerHTML = '';
    placedCount = 0;
    selectedPieceId = null;

    if (!activePlayPuzzle || !activePlayPuzzle.pieces.length) {
        tray.innerHTML = `<p class="text-slate-400 font-bold text-xs mx-auto">No cuts found for this puzzle. Go to "Lasso Cut Creator" to cut pieces!</p>`;
        return;
    }

    const shuffled = [...activePlayPuzzle.pieces];
    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(window.seededRandom() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }

    // 1. Render Missing Lasso Target Holes
    activePlayPuzzle.pieces.forEach(p => {
        const h = document.createElement('div');
        h.id = `hole-${p.id}`;
        h.className = 'lasso-target-hole';
        h.style.cssText = `
            left: ${p.box.xPct}%;
            top: ${p.box.yPct}%;
            width: ${p.box.wPct}%;
            height: ${p.box.hPct}%;
            clip-path: ${p.clipPath};
            background: rgba(8, 12, 24, 0.94);
            border: 2px dashed rgba(255, 255, 255, 0.85);
        `;
        h.onclick = () => handleTargetHoleClick(p.id);
        holes.appendChild(h);
    });

    // 2. Render Bottom Tray Pieces in Uniform Cards
    const imgSrc = activePlayPuzzle.previewData || activePlayPuzzle.url;
    shuffled.forEach(p => {
        const card = document.createElement('div');
        card.id = `tray-${p.id}`;
        card.className = 'tray-card';

        // Display the isolated piece with its exact lasso cut shape inside
        card.innerHTML = `
            <div style="
                width: 100%;
                height: 100%;
                clip-path: ${p.clipPath};
                position: relative;
                overflow: hidden;
            ">
                <img src="${imgSrc}" style="
                    position: absolute;
                    width: ${(100 / p.box.wPct) * 100}%;
                    height: ${(100 / p.box.hPct) * 100}%;
                    left: -${(p.box.xPct / p.box.wPct) * 100}%;
                    top: -${(p.box.yPct / p.box.hPct) * 100}%;
                    max-width: none;
                    pointer-events: none;
                ">
            </div>
        `;

        card.onclick = () => selectTrayPiece(p.id);
        tray.appendChild(card);
    });
}

function selectTrayPiece(id) {
    playTone(500, 'sine', 0.08);
    selectedPieceId = id;
    document.querySelectorAll('.tray-card').forEach(c => c.classList.remove('selected'));
    const chosen = document.getElementById(`tray-${id}`);
    if (chosen) chosen.classList.add('selected');
}

// MATCHING MECHANISM: GREEN & RED EXPANSION LOGIC
function handleTargetHoleClick(targetId) {
    if (!selectedPieceId) {
        playTone(250, 'sawtooth', 0.1);
        return;
    }

    const holeEl = document.getElementById(`hole-${targetId}`);
    if (!holeEl) return;

    if (selectedPieceId === targetId) {
        // SUCCESS: GREEN EXPANDING RING
        playTone(750, 'triangle', 0.16);
        holeEl.classList.remove('error-expand');
        holeEl.classList.add('success-expand');

        const p = activePlayPuzzle.pieces.find(x => x.id === targetId);
        const trayEl = document.getElementById(`tray-${targetId}`);
        const imgSrc = activePlayPuzzle.previewData || activePlayPuzzle.url;

        setTimeout(() => {
            holeEl.style.display = 'none';
            if (trayEl) trayEl.classList.add('used');
        }, 220);

        // Snap and place the cut piece
        const placed = document.createElement('div');
        placed.className = 'placed-lasso-piece';
        placed.style.cssText = `
            left: ${p.box.xPct}%;
            top: ${p.box.yPct}%;
            width: ${p.box.wPct}%;
            height: ${p.box.hPct}%;
            clip-path: ${p.clipPath};
            overflow: hidden;
        `;
        placed.innerHTML = `
            <img src="${imgSrc}" style="
                position: absolute;
                width: ${(100 / p.box.wPct) * 100}%;
                height: ${(100 / p.box.hPct) * 100}%;
                left: -${(p.box.xPct / p.box.wPct) * 100}%;
                top: -${(p.box.yPct / p.box.hPct) * 100}%;
                max-width: none;
            ">
        `;
        document.getElementById('play-placed-container').appendChild(placed);

        selectedPieceId = null;
        placedCount++;

        if (placedCount === activePlayPuzzle.pieces.length) {
            setTimeout(() => {
                try { confetti({ particleCount: 110, spread: 75, origin: { y: 0.6 } }); } catch(e){}
                playTone(1000, 'sine', 0.4);
                alert("🎉 Puzzle Solved Successfully!");
            }, 350);
        }
    } else {
        // FAILURE: RED EXPANDING RING
        playTone(180, 'sawtooth', 0.22);
        holeEl.classList.remove('error-expand');
        void holeEl.offsetWidth; // restart animation
        holeEl.classList.add('error-expand');

        const card = document.getElementById(`tray-${selectedPieceId}`);
        if (card) {
            card.style.transform = 'translateX(-6px)';
            setTimeout(() => card.style.transform = 'translateX(6px)', 90);
            setTimeout(() => card.style.transform = '', 180);
        }
    }
}

// ========================================================
// JSON DATA DOWNLOAD / IMPORT
// ========================================================
function openJsonModal() {
    const exportData = db.map(item => ({
        id: item.id,
        name: item.name,
        url: item.url,
        pieces: item.pieces
    }));

    document.getElementById('json-preview').innerText = JSON.stringify(exportData, null, 2);
    document.getElementById('json-modal').classList.remove('hidden');
}

function closeJsonModal() {
    document.getElementById('json-modal').classList.add('hidden');
}

function exportJsonFile() {
    const exportData = db.map(item => ({
        id: item.id,
        name: item.name,
        url: item.url,
        pieces: item.pieces
    }));

    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'puzzles.json';
    a.click();
    URL.revokeObjectURL(a.href);
}

function importJsonFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
        try {
            const parsed = JSON.parse(reader.result);
            if (Array.isArray(parsed) && parsed.length) {
                db = parsed;
                renderLibraryDropdown();
                loadPlayPuzzle(db[0].id);
                closeJsonModal();
                alert("puzzles.json imported successfully!");
            }
        } catch(err) {
            alert("Invalid JSON format!");
        }
    };
    reader.readAsText(file);
}

// Start
initDatabase();
</script>
