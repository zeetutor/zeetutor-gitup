<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Worksheet</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    min-height: 100vh;
    background: #0f172a;
    font-family: 'Nunito', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }
  .card {
    background: #ffffff;
    border-radius: 24px;
    padding: 20px;
    max-width: 820px;
    width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    text-align: center;
  }
  .title { font-family: 'Fredoka One', cursive; font-size: 1.8rem; color: #4338ca; }
  .prompt { font-size: 1.2rem; font-weight: 800; color: #64748b; margin-top: 4px; margin-bottom: 14px; }
  .target-frame { max-width: 160px; max-height: 160px; border-radius: 16px; border: 4px solid #6366f1; object-fit: contain; margin-bottom: 14px; background: #000; }
  .grid-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
  .opt-card {
    border: 4px solid #e2e8f0;
    border-radius: 16px;
    padding: 8px;
    cursor: pointer;
    background: #f8fafc;
    transition: transform 0.15s, border-color 0.15s;
  }
  .opt-card:hover { transform: scale(1.03); border-color: #94a3b8; }
  .opt-card.correct { border-color: #22c55e; background: #dcfce7; transform: scale(1.06); }
  .opt-card.wrong { border-color: #ef4444; background: #fee2e2; animation: shake 0.4s; }
  .opt-card img, .opt-card video { width: 100%; aspect-ratio: 1; object-fit: contain; border-radius: 10px; pointer-events: none; background: #000; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
</style>
</head>
<body>
  <div class="card" id="mainCard">
    <div class="title" id="wsTitle">LiveTutor Worksheet</div>
    <div class="prompt" id="wsPrompt">Loading questions...</div>
    <div id="targetBox"></div>
    <div class="grid-opts" id="optsBox"></div>
  </div>

<script>
  let wsConfig = null;
  let qIndex = 0;
  window.isSimulating = false;

  const urlParams = new URLSearchParams(window.location.search || window.location.hash.replace('#', '?'));
  const roomId = urlParams.get('room') || '1000';

  // Seeded Random Shuffle
  let seedValue = 0;
  for (let i = 0; i < roomId.length; i++) seedValue += roomId.charCodeAt(i);

  function seededRandom() {
    let x = Math.sin(seedValue++) * 10000;
    return x - Math.floor(x);
  }

  function shuffle(arr) {
    let a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(seededRandom() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function playSound(type) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = (type === 'win') ? 'sine' : 'sawtooth';
      osc.frequency.setValueAtTime((type === 'win') ? 587 : 160, ctx.currentTime);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.35);
    } catch (e) {}
  }

  // --- DUAL-MASTER CONSOLE BROADCAST LISTENER ---
  window.addEventListener('message', (ev) => {
    if (!ev.data) return;
    if (ev.data.type === 'EXECUTE_UNIVERSAL_ACTION') {
      const act = ev.data.action;
      if (!act) return;
      window.isSimulating = true;
      if (act.type === 'UNIVERSAL_CLICK' && act.selector) {
        const el = document.querySelector(act.selector);
        if (el) el.click();
      }
      setTimeout(() => { window.isSimulating = false; }, 40);
    }
  });

  // Relative Mouse Coordinate Broadcast
  document.addEventListener('mousemove', (e) => {
    const card = document.getElementById('mainCard');
    if (!card || window.isSimulating) return;
    const rect = card.getBoundingClientRect();
    const pctX = ((e.clientX - rect.left) / rect.width) * 100;
    const pctY = ((e.clientY - rect.top) / rect.height) * 100;
    if (pctX >= 0 && pctX <= 100 && pctY >= 0 && pctY <= 100) {
      window.parent.postMessage({
        type: 'IFRAME_MOUSE_TRACK',
        payload: { pctX, pctY }
      }, '*');
    }
  });

  // Fetch worksheet.json from local package
  fetch('worksheet.json')
    .then(r => r.json())
    .then(data => {
      wsConfig = data;
      document.getElementById('wsTitle').innerText = data.title || 'Worksheet';
      loadCurrentQuestion();
    })
    .catch(err => {
      document.getElementById('wsPrompt').innerText = 'worksheet.json not found!';
    });

  function loadCurrentQuestion() {
    if (!wsConfig || !wsConfig.questions.length) return;
    if (qIndex >= wsConfig.questions.length) {
      document.getElementById('wsPrompt').innerText = '🎉 Congratulations! Completed.';
      document.getElementById('targetBox').innerHTML = '';
      document.getElementById('optsBox').innerHTML = '<button onclick="location.reload()" style="padding:10px 20px; font-weight:800; border-radius:12px; background:#4338ca; color:#fff; border:none; cursor:pointer;">Play Again</button>';
      return;
    }

    const q = wsConfig.questions[qIndex];
    document.getElementById('wsPrompt').innerText = q.prompt;

    const tBox = document.getElementById('targetBox');
    tBox.innerHTML = '';
    if (q.questionMedia) {
      const isVid = q.questionMedia.endsWith('.mp4') || q.questionMedia.endsWith('.webm');
      tBox.innerHTML = isVid
        ? `<video src="${q.questionMedia}" class="target-frame" autoplay muted loop></video>`
        : `<img src="${q.questionMedia}" class="target-frame">`;
    }

    const oBox = document.getElementById('optsBox');
    oBox.innerHTML = '';
    const shuffledOpts = shuffle(q.options);

    shuffledOpts.forEach((optPath, idx) => {
      const card = document.createElement('div');
      card.className = 'opt-card';
      card.id = 'opt-btn-' + idx;

      const isVid = optPath.endsWith('.mp4') || optPath.endsWith('.webm');
      card.innerHTML = isVid
        ? `<video src="${optPath}" autoplay muted loop></video>`
        : `<img src="${optPath}">`;

      card.onclick = () => {
        if (!window.isSimulating) {
          window.parent.postMessage({
            type: 'IFRAME_ACTION_TRIGGERED',
            payload: {
              type: 'UNIVERSAL_CLICK',
              selector: '#opt-btn-' + idx
            }
          }, '*');
        }

        if (optPath === q.answerMedia) {
          card.classList.add('correct');
          playSound('win');
          setTimeout(() => {
            qIndex++;
            loadCurrentQuestion();
          }, 1200);
        } else {
          card.classList.add('wrong');
          playSound('bad');
          setTimeout(() => { card.classList.remove('wrong'); }, 500);
        }
      };

      oBox.appendChild(card);
    });
  }
</script>
</body>
</html>
