<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nursery Video Player</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #1e1b4b, #0f172a 100%);
      font-family: 'Fredoka One', cursive, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px;
      overflow: hidden;
    }
    .video-card {
      background: rgba(255, 255, 255, 0.98);
      border-radius: 28px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      border: 4px solid #fff;
      max-width: 850px;
      width: 100%;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 2rem;
      color: #ff477e;
      margin-bottom: 12px;
    }
    .video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
      cursor: pointer;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    
    /* Play/Pause Overlay Icon */
    .play-pause-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.65);
      color: #ffffff;
      width: 75px;
      height: 75px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      pointer-events: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    /* Sound Banner for Browser Autoplay Policy */
    .sound-banner {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: #ff5964;
      color: #ffffff;
      padding: 10px 24px;
      border-radius: 40px;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,0.3);
      z-index: 10;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.05); }
    }

    /* Quick Control Bar */
    .controls-bar {
      margin-top: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }
    .ctrl-btn {
      background: #f1f5f9;
      border: 2px solid #cbd5e1;
      padding: 8px 18px;
      border-radius: 12px;
      font-family: inherit;
      font-weight: bold;
      color: #334155;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .ctrl-btn:hover { background: #e2e8f0; transform: translateY(-2px); }
  </style>
</head>
<body>

  <div class="video-card">
    <div class="title" id="videoTitle">Loading Video...</div>
    
    <div class="video-container" id="videoContainer">
      <video id="kidsVideo" autoplay muted playsinline loop></video>
      <div class="play-pause-badge" id="playPauseBadge">▶</div>
      <div class="sound-banner" id="soundBtn" onclick="toggleSound(event)">
        🔊 Tap for Sound!
      </div>
    </div>

    <!-- Dual Sync Control Buttons -->
    <div class="controls-bar">
      <button class="ctrl-btn" id="btn-toggle-play" onclick="handlePlayPauseClick()">⏸ Pause</button>
      <button class="ctrl-btn" id="btn-restart" onclick="handleRestartClick()">↺ Restart</button>
    </div>
  </div>

  <script>
    const vid = document.getElementById('kidsVideo');
    const soundBtn = document.getElementById('soundBtn');
    const titleEl = document.getElementById('videoTitle');
    const badge = document.getElementById('playPauseBadge');
    const toggleBtn = document.getElementById('btn-toggle-play');

    window.isSimulating = false;

    // Load path from worksheet.json
    fetch('worksheet.json')
      .then(res => res.json())
      .then(data => {
        if (data.title) titleEl.innerText = data.title;
        if (data.video) {
          vid.src = encodeURI(data.video);
          vid.play().catch(e => console.log("Waiting interaction:", e));
        }
      })
      .catch(() => {
        titleEl.innerText = "worksheet.json not found!";
      });

    // 1. Play / Pause Toggle Logic
    function togglePlayPause() {
      if (vid.paused) {
        vid.play();
        toggleBtn.innerText = "⏸ Pause";
        showBadge("▶");
      } else {
        vid.pause();
        toggleBtn.innerText = "▶ Play";
        showBadge("⏸");
      }
    }

    function showBadge(icon) {
      badge.innerText = icon;
      badge.style.display = 'flex';
      setTimeout(() => { badge.style.display = 'none'; }, 600);
    }

    function handlePlayPauseClick() {
      if (!window.isSimulating) {
        window.parent.postMessage({
          type: 'IFRAME_ACTION_TRIGGERED',
          payload: { type: 'UNIVERSAL_CLICK', selector: '#btn-toggle-play' }
        }, '*');
      }
      togglePlayPause();
    }

    function handleRestartClick() {
      if (!window.isSimulating) {
        window.parent.postMessage({
          type: 'IFRAME_ACTION_TRIGGERED',
          payload: { type: 'UNIVERSAL_CLICK', selector: '#btn-restart' }
        }, '*');
      }
      vid.currentTime = 0;
      vid.play();
      toggleBtn.innerText = "⏸ Pause";
    }

    function toggleSound(e) {
      if (e) e.stopPropagation();
      if (vid.muted) {
        vid.muted = false;
        vid.volume = 1.0;
        soundBtn.style.display = 'none';
      }
    }

    // Video container tap-to-play/pause
    document.getElementById('videoContainer').addEventListener('click', (e) => {
      if (e.target === soundBtn) return;
      if (vid.muted) toggleSound(e);
      handlePlayPauseClick();
    });

    // 2. STOP AUDIO ON EXIT / BACK FIX (Immediate Cleanup)
    function stopAndKillMedia() {
      try {
        vid.pause();
        vid.muted = true;
        vid.removeAttribute('src');
        vid.load();
      } catch(e) {}
    }

    window.addEventListener('beforeunload', stopAndKillMedia);
    window.addEventListener('pagehide', stopAndKillMedia);
    window.addEventListener('unload', stopAndKillMedia);

    // 3. Dual-Master Console Universal Action Listeners
    window.addEventListener('message', ev => {
      if (ev.data && ev.data.type === 'EXECUTE_UNIVERSAL_ACTION') {
        const act = ev.data.action;
        if (!act) return;
        window.isSimulating = true;
        if (act.type === 'UNIVERSAL_CLICK' && act.selector) {
          const el = document.querySelector(act.selector);
          if (el) el.click();
        }
        setTimeout(() => { window.isSimulating = false; }, 40);
      }
    });

    // Mouse Tracking Dispatch
    document.addEventListener('mousemove', e => {
      window.parent.postMessage({
        type: 'IFRAME_MOUSE_TRACK',
        payload: {
          pctX: (e.clientX / window.innerWidth) * 100,
          pctY: (e.clientY / window.innerHeight) * 100
        }
      }, '*');
    });
  </script>

</body>
</html>
