<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Worksheet</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    min-height: 100vh;
    background: radial-gradient(circle at top, #1e1b4b, #0f172a 100%);
    font-family: 'Nunito', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow: hidden;
    position: relative;
  }
  .card {
    background: rgba(255, 255, 255, 0.98);
    border-radius: 28px;
    padding: 24px;
    max-width: 840px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    text-align: center;
    position: relative;
    z-index: 10;
  }
  .title { font-family: 'Fredoka One', cursive; font-size: 2rem; color: #4338ca; }
  .prompt { font-size: 1.25rem; font-weight: 800; color: #475569; margin-top: 4px; margin-bottom: 16px; }
  .target-frame { max-width: 170px; max-height: 170px; border-radius: 18px; border: 4px solid #6366f1; object-fit: contain; margin-bottom: 16px; background: #000; box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3); }
  .grid-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .opt-card {
    border: 4px solid #e2e8f0;
    border-radius: 18px;
    padding: 8px;
    cursor: pointer;
    background: #f8fafc;
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.2s;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  }
  .opt-card:hover { transform: translateY(-4px) scale(1.03); border-color: #818cf8; }
  .opt-card.correct { border-color: #22c55e; background: #dcfce7; transform: scale(1.06); box-shadow: 0 0 20px rgba(34, 197, 94, 0.4); }
  .opt-card.wrong { border-color: #ef4444; background: #fee2e2; animation: shake 0.4s; }
  .opt-card img, .opt-card video { width: 100%; aspect-ratio: 1; object-fit: contain; border-radius: 12px; pointer-events: none; background: #000; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }

  /* Floating Emoji Animations */
  .floating-emoji {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    animation: floatUp 1.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }
  @keyframes floatUp {
    0% {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.4) rotate(0deg);
    }
    15% {
      opacity: 1;
      transform: translate(-50%, -80px) scale(1.4) rotate(-15deg);
    }
    100% {
      opacity: 0;
      transform: translate(calc(-50% + var(--rand-x)), -350px) scale(0.8) rotate(var(--rand-rot));
    }
  }

  /* 4 Reward Buttons Bar */
  .reaction-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    background: #f1f5f9;
    padding: 8px 16px;
    border-radius: 40px;
    width: fit-content;
    margin: 0 auto;
    border: 2px solid #cbd5e1;
  }
  .react-btn {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    font-size: 1.4rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 4px 6px rgba(0,0,0,0.06);
  }
  .react-btn:hover {
    transform: scale(1.25) rotate(8deg);
    border-color: #6366f1;
  }
  .react-btn:active {
    transform: scale(0.9);
  }
</style>
</head>
<body>
  <div class="card" id="mainCard">
    <div class="title" id="wsTitle">LiveTutor Worksheet</div>
    <div class="prompt" id="wsPrompt">Loading questions...</div>
    <div id="targetBox"></div>
    <div class="grid-opts" id="optsBox"></div>

    <!-- Chocolate, Ice Cream, Star, Heart Bar -->
    <div class="reaction-bar">
      <button class="react-btn" id="btn-choc" onclick="onReactionClick('🍫', '#btn-choc')" title="Chocolate">🍫</button>
      <button class="react-btn" id="btn-ice" onclick="onReactionClick('🍦', '#btn-ice')" title="Ice Cream">🍦</button>
      <button class="react-btn" id="btn-star" onclick="onReactionClick('⭐', '#btn-star')" title="Star">⭐</button>
      <button class="react-btn" id="btn-heart" onclick="onReactionClick('❤️', '#btn-heart')" title="Heart">❤️</button>
    </div>
  </div>

<script>
  let wsConfig = null;
  let qIndex = 0;
  window.isSimulating = false;

  const urlParams = new URLSearchParams(window.location.search || window.location.hash.replace('#', '?'));
  const roomId = urlParams.get('room') || '1000';

  let seedValue = 0;
  for (let i = 0; i < roomId.length; i++) seedValue += roomId.charCodeAt(i);

  function seededRandom() {
    let x = Math.sin(seedValue++) * 10000;
    return x - Math.floor(x);
  }

  function shuffle(arr) {
    let a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(seededRandom() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function playSound(type) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = (type === 'bad') ? 'sawtooth' : 'sine';
      let freq = 587;
      if (type === 'bad') freq = 160;
      if (type === 'chime') freq = 880;

      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.35);
    } catch (e) {}
  }

  function spawnFloatingEmojis(emoji) {
    playSound('chime');
    const count = 6;
    for (let i = 0; i < count; i++) {
      const span = document.createElement('span');
      span.className = 'floating-emoji';
      span.innerText = emoji;
      span.style.fontSize = (Math.random() * 20 + 28) + 'px';
      span.style.left = (window.innerWidth / 2 + (Math.random() * 120 - 60)) + 'px';
      span.style.top = (window.innerHeight / 2 + (Math.random() * 60 - 30)) + 'px';
      span.style.setProperty('--rand-x', (Math.random() * 200 - 100) + 'px');
      span.style.setProperty('--rand-rot', (Math.random() * 60 - 30) + 'deg');
      document.body.appendChild(span);
      setTimeout(() => span.remove(), 1600);
    }
  }

  function onReactionClick(emoji, selector) {
    if (!window.isSimulating) {
      window.parent.postMessage({
        type: 'IFRAME_ACTION_TRIGGERED',
        payload: {
          type: 'UNIVERSAL_CLICK',
          selector: selector
        }
      }, '*');
    }
    spawnFloatingEmojis(emoji);
  }

  // --- DUAL MASTER UNIVERSAL ACTIONS ---
  window.addEventListener('message', (ev) => {
    if (!ev.data) return;
    if (ev.data.type === 'EXECUTE_UNIVERSAL_ACTION') {
      const act = ev.data.action;
      if (!act) return;
      window.isSimulating = true;
      if (act.type === 'UNIVERSAL_CLICK' && act.selector) {
        const el = document.querySelector(act.selector);
        if (el) el.click();
      }
      setTimeout(() => { window.isSimulating = false; }, 40);
    }
  });

  document.addEventListener('mousemove', (e) => {
    const card = document.getElementById('mainCard');
    if (!card || window.isSimulating) return;
    const rect = card.getBoundingClientRect();
    const pctX = ((e.clientX - rect.left) / rect.width) * 100;
    const pctY = ((e.clientY - rect.top) / rect.height) * 100;
    if (pctX >= 0 && pctX <= 100 && pctY >= 0 && pctY <= 100) {
      window.parent.postMessage({
        type: 'IFRAME_MOUSE_TRACK',
        payload: { pctX, pctY }
      }, '*');
    }
  });

  fetch('worksheet.json')
    .then(r => r.json())
    .then(data => {
      wsConfig = data;
      document.getElementById('wsTitle').innerText = data.title || 'Worksheet';
      loadCurrentQuestion();
    })
    .catch(err => {
      document.getElementById('wsPrompt').innerText = 'worksheet.json not found!';
    });

  function loadCurrentQuestion() {
    if (!wsConfig || !wsConfig.questions.length) return;
    if (qIndex >= wsConfig.questions.length) {
      document.getElementById('wsPrompt').innerText = '🎉 Congratulations! Completed.';
      document.getElementById('targetBox').innerHTML = '';
      document.getElementById('optsBox').innerHTML = '<button onclick="location.reload()" style="padding:10px 20px; font-weight:800; border-radius:12px; background:#4338ca; color:#fff; border:none; cursor:pointer;">Play Again</button>';
      return;
    }

    const q = wsConfig.questions[qIndex];
    document.getElementById('wsPrompt').innerText = q.prompt;

    const tBox = document.getElementById('targetBox');
    tBox.innerHTML = '';
    if (q.questionMedia) {
      const isVid = q.questionMedia.endsWith('.mp4') || q.questionMedia.endsWith('.webm');
      tBox.innerHTML = isVid
        ? `<video src="${q.questionMedia}" class="target-frame" autoplay muted loop></video>`
        : `<img src="${q.questionMedia}" class="target-frame">`;
    }

    const oBox = document.getElementById('optsBox');
    oBox.innerHTML = '';
    const shuffledOpts = shuffle(q.options);

    shuffledOpts.forEach((optPath, idx) => {
      const card = document.createElement('div');
      card.className = 'opt-card';
      card.id = 'opt-btn-' + idx;

      const isVid = optPath.endsWith('.mp4') || optPath.endsWith('.webm');
      card.innerHTML = isVid
        ? `<video src="${optPath}" autoplay muted loop></video>`
        : `<img src="${optPath}">`;

      card.onclick = () => {
        if (!window.isSimulating) {
          window.parent.postMessage({
            type: 'IFRAME_ACTION_TRIGGERED',
            payload: {
              type: 'UNIVERSAL_CLICK',
              selector: '#opt-btn-' + idx
            }
          }, '*');
        }

        if (optPath === q.answerMedia) {
          card.classList.add('correct');
          playSound('win');
          spawnFloatingEmojis('⭐');
          setTimeout(() => {
            qIndex++;
            loadCurrentQuestion();
          }, 1200);
        } else {
          card.classList.add('wrong');
          playSound('bad');
          setTimeout(() => { card.classList.remove('wrong'); }, 500);
        }
      };

      oBox.appendChild(card);
    });
  }
</script>
</body>
</html>
