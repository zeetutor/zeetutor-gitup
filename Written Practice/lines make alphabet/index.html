<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Alphabet Line-Builder — Synced Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body, html { touch-action: none; user-select: none; -webkit-user-select: none; overflow: hidden; height: 100dvh; max-height: 100dvh; width: 100%; }
    .tray-piece, .mini-piece { transition: transform .15s ease-out; cursor: grab; }
    .tray-piece:active { cursor: grabbing; transform: scale(1.08); }
    .guide-slot.hovered, .mini-piece.hovered { filter: drop-shadow(0 0 8px #6366f1); border-color: #6366f1 !important; }
    #confetti-canvas { pointer-events:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:50; }
    .seg-bar { width:100%; height:100%; border-radius:999px; transition: background-color .25s ease, transform .2s ease; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Remote pointer indicator */
    #remote-cursor {
      position: fixed; width: 20px; height: 20px;
      border-radius: 50%; background: #ef4444; border: 2px solid white;
      pointer-events: none; z-index: 9999; display: none;
      transform: translate(-50%, -50%); box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 h-[100dvh] max-h-[100dvh] text-slate-700 flex flex-col overflow-hidden font-sans">

<div id="remote-cursor"></div>
<canvas id="confetti-canvas"></canvas>
<div id="drag-ghost" class="fixed pointer-events-none z-50 opacity-80 hidden flex items-center justify-center"></div>

<!-- HEADER BAR -->
<header class="bg-white/85 backdrop-blur-md shadow-sm border-b border-indigo-100/60 px-3 py-1.5 flex flex-wrap justify-between items-center gap-1 z-30 shrink-0">
  <div class="flex items-center gap-2">
    <div class="p-1.5 bg-gradient-to-br from-indigo-500 to-purple-600 text-white rounded-xl shadow-sm">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"/></svg>
    </div>

  </div>
  
  <div class="flex bg-slate-100 p-0.5 rounded-xl text-xs font-bold shadow-inner">
    <button id="tab-build" class="px-3 py-1 rounded-lg text-indigo-600 bg-white shadow-sm transition" onclick="switchSection('build')">🔨 Build</button>
    <button id="tab-practice" class="px-3 py-1 rounded-lg text-slate-500 hover:text-slate-800 transition" onclick="switchSection('practice')">✏️ Practice</button>
    <button id="tab-canvas" class="px-3 py-1 rounded-lg text-slate-500 hover:text-slate-800 transition" onclick="switchSection('canvas')">🌈 Canvas</button>
  </div>

  <div class="hidden sm:flex items-center gap-1">
    <span class="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold bg-indigo-50 text-indigo-600 border border-indigo-100">
      Room: <strong id="room-code-badge">...</strong>
    </span>
  </div>
</header>

<!-- MAIN CONTAINER -->
<main class="flex-1 overflow-hidden relative flex flex-col items-center justify-start pt-2 px-2 pb-2 gap-2">

  <!-- ================= SECTION 1: BUILD ALPHABET ================= -->
  <section id="section-build" class="w-full max-w-lg mx-auto flex flex-col justify-start gap-2">
    <div class="flex items-center justify-between bg-white/90 p-1.5 rounded-2xl gap-2 w-full max-w-sm mx-auto shadow-sm border border-indigo-100">
      <div class="flex items-center gap-1">
        <button id="btn-prev-letter" class="w-8 h-8 rounded-xl bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 flex items-center justify-center active:scale-95 text-xs font-bold shadow-sm" onclick="changeLetter(-1)">◀</button>
        <div class="bg-indigo-50 px-3 py-0.5 rounded-xl border border-indigo-200 flex items-center justify-center min-w-[55px] h-8">
          <span id="active-letter-lbl" class="text-base font-black text-indigo-600 font-mono">A</span>
        </div>
        <button id="btn-next-letter" class="w-8 h-8 rounded-xl bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 flex items-center justify-center active:scale-95 text-xs font-bold shadow-sm" onclick="changeLetter(1)">▶</button>
      </div>
      <div class="flex items-center gap-1.5">
        <button id="btn-toggle-trace" class="px-2.5 text-xs font-bold rounded-xl border bg-indigo-600 text-white border-indigo-500 h-8 shadow-sm transition" onclick="toggleTraceMode()">🔍 Trace: ON</button>
        <button id="btn-reset-letter" class="px-2.5 text-xs font-bold rounded-xl border border-rose-200 bg-rose-50 text-rose-600 hover:bg-rose-100 h-8 shadow-sm transition" onclick="resetActiveLetter()">🔄 Reset</button>
      </div>
    </div>

    <!-- Letter Drop Arena -->
    <div class="flex items-center justify-center relative">
      <div id="drop-box-arena" class="relative w-[min(74vw,34vh,280px)] h-[min(74vw,34vh,280px)] bg-white rounded-3xl shadow-lg border-4 border-dashed border-indigo-200/80 overflow-hidden">
        <div class="absolute inset-0 rounded-2xl opacity-10 pointer-events-none" style="background-image: radial-gradient(#4f46e5 1.5px, transparent 1.5px); background-size: 16px 16px;"></div>
        
        <div id="letter-complete-stamp" class="absolute inset-0 bg-emerald-500/95 backdrop-blur-sm rounded-2xl flex flex-col justify-center items-center gap-1 opacity-0 pointer-events-none transition-all duration-300 z-20">
          <div class="w-12 h-12 bg-white text-emerald-500 rounded-full flex items-center justify-center text-2xl shadow-lg animate-bounce">✓</div>
          <h2 class="text-white font-black text-base uppercase tracking-wider">Perfect Fit!</h2>
        </div>
        
        <!-- Precise Vectors Layout Container -->
        <div id="blueprint-space" class="absolute inset-2 pointer-events-none"></div>
      </div>
    </div>

    <!-- Line Choices for Building Alphabet -->
    <div class="w-full max-w-sm mx-auto bg-white/70 border border-indigo-100/80 rounded-2xl p-2 shadow-sm">
      <div class="text-center text-[10px] font-black uppercase text-indigo-500 mb-1.5 tracking-wider">🎯 Drag Lines to Build Letter</div>
      <div id="mini-grid-container" class="flex flex-wrap items-center justify-center gap-2 px-1 min-h-[50px]"></div>
    </div>
  </section>

  <!-- ================= SECTION 2: PRACTICE STROKES ================= -->
  <section id="section-practice" class="w-full max-w-lg mx-auto flex flex-col justify-start gap-2 hidden">
    <div class="flex items-center justify-between bg-white/90 p-1.5 rounded-2xl gap-2 w-full max-w-sm mx-auto shadow-sm border border-indigo-100">
      <div class="flex items-center gap-1">
        <button id="btn-prev-type" class="w-8 h-8 rounded-xl bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 flex items-center justify-center active:scale-95 text-xs font-bold" onclick="changePracticeType(-1)">◀</button>
        <div class="bg-indigo-50 px-3 py-0.5 rounded-xl border border-indigo-200 flex items-center justify-center min-w-[90px] h-8">
          <span id="active-practice-lbl" class="text-xs font-black text-indigo-600 uppercase truncate">Standing</span>
        </div>
        <button id="btn-next-type" class="w-8 h-8 rounded-xl bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 flex items-center justify-center active:scale-95 text-xs font-bold" onclick="changePracticeType(1)">▶</button>
      </div>
      <button id="btn-reset-practice" class="px-3 text-xs font-bold rounded-xl border border-rose-200 bg-rose-50 text-rose-600 hover:bg-rose-100 h-8" onclick="resetPracticeGrid()">🔄 Reset</button>
    </div>
    
    <div class="grid grid-cols-4 gap-2 p-1 max-w-[280px] mx-auto w-full">
      <div id="practice-grid-container" class="contents"></div>
    </div>
    
    <div class="w-full max-w-sm mx-auto bg-white/70 border border-indigo-100/80 rounded-2xl p-2 shadow-sm">
      <div class="text-center text-[10px] font-black uppercase text-indigo-500 mb-1.5 tracking-wider">🎯 Drag Matching Line</div>
      <div id="practice-piece-container" class="flex flex-wrap items-center justify-center gap-2 px-1 min-h-[50px]"></div>
    </div>
  </section>

  <!-- ================= SECTION 3: FREE CANVAS ================= -->
  <section id="section-canvas" class="w-full max-w-lg mx-auto flex flex-col justify-start gap-2 hidden">
    <div class="flex items-center justify-between bg-white/90 p-1.5 rounded-2xl gap-2 w-full max-w-sm mx-auto shadow-sm border border-indigo-100">
      <div class="flex items-center gap-1.5">
        <button id="btn-rainbow-toggle" class="px-2.5 py-1 text-xs font-bold rounded-xl bg-gradient-to-r from-pink-500 via-yellow-400 to-blue-500 text-white h-8 shadow-sm" onclick="toggleRainbow()">🌈 Rainbow</button>
        <button id="btn-canvas-trace-toggle" class="px-2.5 py-1 text-xs font-bold rounded-xl bg-indigo-600 text-white border-indigo-500 h-8 shadow-sm" onclick="toggleCanvasTrace()">🔍 Trace: ON</button>
      </div>
      <button id="btn-clear-canvas" class="px-3 text-xs font-bold rounded-xl border border-rose-200 bg-rose-50 text-rose-600 hover:bg-rose-100 h-8" onclick="clearCanvas()">🧽 Clear</button>
    </div>
    
    <div class="flex items-center justify-center relative">
      <div class="relative w-[min(74vw,34vh,280px)] h-[min(74vw,34vh,280px)] bg-white rounded-3xl shadow-lg border-4 border-dashed border-indigo-200/80 overflow-hidden">
        <div id="canvas-trace-guide" class="absolute inset-2 pointer-events-none opacity-20"></div>
        <canvas id="draw-canvas" class="absolute inset-0 w-full h-full" style="touch-action: none;"></canvas>
      </div>
    </div>
  </section>

</main>

<script>
// ==========================================
// 1. UNIVERSAL SYNC ENGINE & DUAL-MASTER PROTOCOL
// ==========================================
window.isSimulating = false;
const urlParams = new URLSearchParams(window.location.search || window.location.hash.replace('#', '?'));
const roomId = urlParams.get('room') || '54321';
document.getElementById('room-code-badge').innerText = roomId;

let localSeed = 0;
for (let i = 0; i < roomId.length; i++) { localSeed = roomId.charCodeAt(i) + ((localSeed << 5) - localSeed); }
localSeed = Math.abs(localSeed);
window.seededRandom = function() { let x = Math.sin(localSeed++) * 10000; return x - Math.floor(x); };
Math.random = window.seededRandom;

function sendUniversalAction(actionType, payload = {}) {
  if (window.isSimulating) return;
  const actionId = 'act_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
  window.parent.postMessage({
    type: 'IFRAME_ACTION_TRIGGERED',
    payload: {
      type: actionType,
      actionId,
      seed: localSeed,
      ...payload
    }
  }, '*');
}

// Global Cursor Sync
let lastCursorTime = 0;
document.addEventListener('pointermove', (e) => {
  const now = Date.now();
  if (now - lastCursorTime < 40) return;
  lastCursorTime = now;
  const pctX = (e.clientX / window.innerWidth) * 100;
  const pctY = (e.clientY / window.innerHeight) * 100;
  window.parent.postMessage({ type: 'IFRAME_MOUSE_TRACK', pctX, pctY }, '*');
});

// Full Master Action Receptor
window.addEventListener('message', (event) => {
  if (event.data?.type === 'EXECUTE_UNIVERSAL_ACTION') {
    const action = event.data.action;
    if (!action) return;

    window.isSimulating = true;
    try {
      switch (action.type) {
        case 'SWITCH_SECTION':
          switchSection(action.section, false);
          break;
        case 'CHANGE_LETTER':
          changeLetter(action.dir, false);
          break;
        case 'TOGGLE_TRACE':
          toggleTraceMode(false);
          break;
        case 'RESET_LETTER':
          resetActiveLetter(false);
          break;
        case 'BUILD_LINE_PLACED':
          placedBuildStrokes[action.strokeId] = true;
          playSfxMatch();
          renderActiveLetter();
          checkBuildCompletion(true);
          break;
        case 'PRACTICE_CHANGE_TYPE':
          changePracticeType(action.dir, false);
          break;
        case 'PRACTICE_RESET':
          resetPracticeGrid(false);
          break;
        case 'PRACTICE_CELL_PLACED':
          placedPracticeCells[action.index] = true;
          playSfxPop();
          renderPracticeGrid();
          break;
        case 'CANVAS_CLEAR':
          clearCanvas(false);
          break;
        case 'CANVAS_STROKE_DRAW':
          if (ctx) {
            ctx.strokeStyle = action.color;
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo((action.x1 / 100) * canvas.width, (action.y1 / 100) * canvas.height);
            ctx.lineTo((action.x2 / 100) * canvas.width, (action.y2 / 100) * canvas.height);
            ctx.stroke();
          }
          break;
      }
    } finally {
      window.isSimulating = false;
    }
  }
});

// ==========================================
// 2. VECTOR ALPHABET BLUEPRINTS (SMOOTH FIT)
// ==========================================
const STROKE_TYPES = ['standing','sleeping','slant-left','slant-right','curve-left','curve-right','zigzag','loop','wave'];
const BUILD_TYPES = ['standing','sleeping','slant-left','slant-right','curve-left','curve-right','curve-bottom'];

// Standardized 100x100 grid vectors with aligned joins
const LETTER_BLUEPRINTS = {
  A: [ {type:'slant-left', x1:50,y1:14,x2:22,y2:86}, {type:'slant-right', x1:50,y1:14,x2:78,y2:86}, {type:'sleeping', x1:32,y1:58,x2:68,y2:58} ],
  B: [ {type:'standing', x1:28,y1:14,x2:28,y2:86}, {type:'curve-right', bx:28,by:14,bw:44,bh:36}, {type:'curve-right', bx:28,by:48,bw:46,bh:38} ],
  C: [ {type:'curve-left', bx:26,by:14,bw:48,bh:72} ],
  D: [ {type:'standing', x1:28,y1:14,x2:28,y2:86}, {type:'curve-right', bx:28,by:14,bw:52,bh:72} ],
  E: [ {type:'standing', x1:28,y1:14,x2:28,y2:86}, {type:'sleeping', x1:28,y1:14,x2:72,y2:14}, {type:'sleeping', x1:28,y1:50,x2:62,y2:50}, {type:'sleeping', x1:28,y1:86,x2:72,y2:86} ],
  F: [ {type:'standing', x1:28,y1:14,x2:28,y2:86}, {type:'sleeping', x1:28,y1:14,x2:72,y2:14}, {type:'sleeping', x1:28,y1:50,x2:62,y2:50} ],
  G: [ {type:'curve-left', bx:26,by:14,bw:48,bh:72}, {type:'sleeping', x1:52,y1:54,x2:76,y2:54}, {type:'standing', x1:76,y1:54,x2:76,y2:86} ],
  H: [ {type:'standing', x1:28,y1:14,x2:28,y2:86}, {type:'standing', x1:72,y1:14,x2:72,y2:86}, {type:'sleeping', x1:28,y1:50,x2:72,y2:50} ],
  I: [ {type:'standing', x1:50,y1:14,x2:50,y2:86}, {type:'sleeping', x1:32,y1:14,x2:68,y2:14}, {type:'sleeping', x1:32,y1:86,x2:68,y2:86} ],
  J: [ {type:'sleeping', x1:32,y1:14,x2:74,y2:14}, {type:'standing', x1:66,y1:14,x2:66,y2:56}, {type:'curve-bottom', bx:34,by:56,bw:32,bh:30} ],
  K: [ {type:'standing', x1:28,y1:14,x2:28,y2:86}, {type:'slant-left', x1:72,y1:14,x2:28,y2:50}, {type:'slant-right', x1:28,y1:50,x2:72,y2:86} ],
  L: [ {type:'standing', x1:28,y1:14,x2:28,y2:86}, {type:'sleeping', x1:28,y1:86,x2:72,y2:86} ],
  M: [ {type:'standing', x1:18,y1:14,x2:18,y2:86}, {type:'standing', x1:82,y1:14,x2:82,y2:86}, {type:'slant-right', x1:18,y1:14,x2:50,y2:58}, {type:'slant-left', x1:82,y1:14,x2:50,y2:58} ],
  N: [ {type:'standing', x1:24,y1:14,x2:24,y2:86}, {type:'standing', x1:76,y1:14,x2:76,y2:86}, {type:'slant-right', x1:24,y1:14,x2:76,y2:86} ],
  O: [ {type:'curve-left', bx:22,by:14,bw:28,bh:72}, {type:'curve-right', bx:50,by:14,bw:28,bh:72} ],
  P: [ {type:'standing', x1:28,y1:14,x2:28,y2:86}, {type:'curve-right', bx:28,by:14,bw:46,bh:38} ],
  Q: [ {type:'curve-left', bx:22,by:14,bw:28,bh:72}, {type:'curve-right', bx:50,by:14,bw:28,bh:72}, {type:'slant-right', x1:54,y1:64,x2:82,y2:88} ],
  R: [ {type:'standing', x1:28,y1:14,x2:28,y2:86}, {type:'curve-right', bx:28,by:14,bw:46,bh:38}, {type:'slant-right', x1:30,y1:50,x2:72,y2:86} ],
  S: [ {type:'curve-left', bx:28,by:14,bw:44,bh:36}, {type:'curve-right', bx:28,by:50,bw:44,bh:36} ],
  T: [ {type:'sleeping', x1:18,y1:14,x2:82,y2:14}, {type:'standing', x1:50,y1:14,x2:50,y2:86} ],
  U: [ {type:'standing', x1:24,y1:14,x2:24,y2:58}, {type:'standing', x1:76,y1:14,x2:76,y2:58}, {type:'curve-bottom', bx:24,by:56,bw:52,bh:30} ],
  V: [ {type:'slant-right', x1:22,y1:14,x2:50,y2:86}, {type:'slant-left', x1:78,y1:14,x2:50,y2:86} ],
  W: [ {type:'slant-right', x1:14,y1:14,x2:34,y2:86}, {type:'slant-left', x1:50,y1:48,x2:34,y2:86}, {type:'slant-right', x1:50,y1:48,x2:66,y2:86}, {type:'slant-left', x1:86,y1:14,x2:66,y2:86} ],
  X: [ {type:'slant-right', x1:20,y1:14,x2:80,y2:86}, {type:'slant-left', x1:80,y1:14,x2:20,y2:86} ],
  Y: [ {type:'slant-right', x1:22,y1:14,x2:50,y2:50}, {type:'slant-left', x1:78,y1:14,x2:50,y2:50}, {type:'standing', x1:50,y1:50,x2:50,y2:86} ],
  Z: [ {type:'sleeping', x1:24,y1:14,x2:76,y2:14}, {type:'slant-left', x1:76,y1:14,x2:24,y2:86}, {type:'sleeping', x1:24,y1:86,x2:76,y2:86} ]
};

Object.keys(LETTER_BLUEPRINTS).forEach(l => {
  LETTER_BLUEPRINTS[l].forEach((seg, i) => seg.id = `${l}-${i}`);
});

const LETTERS = Object.keys(LETTER_BLUEPRINTS);
let activeLetterIdx = 0;
let traceGuideOn = true;
let activeSection = 'build';
let placedBuildStrokes = {};
let practiceTypeIdx = 0;
let placedPracticeCells = {};

// Clean Vector SVG Renderer for Smooth Lines
function getStrokeSVG(type, color, strokeWidth = "10") {
  const sw = parseInt(strokeWidth);
  switch (type) {
    case 'standing':
      return `<svg class="w-full h-full" viewBox="0 0 20 100"><line x1="10" y1="6" x2="10" y2="94" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/></svg>`;
    case 'sleeping':
      return `<svg class="w-full h-full" viewBox="0 0 100 20"><line x1="6" y1="10" x2="94" y2="10" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/></svg>`;
    case 'slant-left':
      return `<svg class="w-full h-full" viewBox="0 0 100 100"><line x1="86" y1="14" x2="14" y2="86" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/></svg>`;
    case 'slant-right':
      return `<svg class="w-full h-full" viewBox="0 0 100 100"><line x1="14" y1="14" x2="86" y2="86" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/></svg>`;
    case 'curve-left':
      return `<svg class="w-full h-full" viewBox="0 0 50 100"><path d="M 44,6 C 10,12 10,88 44,94" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/></svg>`;
    case 'curve-right':
      return `<svg class="w-full h-full" viewBox="0 0 50 100"><path d="M 6,6 C 40,12 40,88 6,94" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/></svg>`;
    case 'curve-bottom':
      return `<svg class="w-full h-full" viewBox="0 0 100 50"><path d="M 6,6 C 12,40 88,40 94,6" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/></svg>`;
    case 'zigzag':
      return `<svg class="w-full h-full" viewBox="0 0 100 100"><path d="M 14,50 L 38,18 L 62,82 L 86,50" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    case 'loop':
      return `<svg class="w-full h-full" viewBox="0 0 100 100"><path d="M 14,65 C 44,65 34,25 50,25 C 66,25 56,65 86,65" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/></svg>`;
    case 'wave':
      return `<svg class="w-full h-full" viewBox="0 0 100 100"><path d="M 14,50 Q 32,20 50,50 T 86,50" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/></svg>`;
    default:
      return '';
  }
}

function friendlyLabel(t) { return t.replace('-', ' '); }

// Audio feedback
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playTone(freq, type, dur) {
  initAudio();
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
function playSfxMatch() { playTone(523.25, 'triangle', 0.1); setTimeout(() => playTone(659.25, 'triangle', 0.15), 80); }
function playSfxWrong() { playTone(160, 'sawtooth', 0.22); }
function playSfxPop() { playTone(783.99, 'sine', 0.08); }
function playSfxWin() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => setTimeout(() => playTone(f, 'triangle', 0.14), i * 70)); }

function lineGeom(seg) {
  const dx = seg.x2 - seg.x1, dy = seg.y2 - seg.y1;
  return { len: Math.hypot(dx, dy), angle: Math.atan2(dy, dx) * 180 / Math.PI, midX: (seg.x1 + seg.x2) / 2, midY: (seg.y1 + seg.y2) / 2 };
}

function populateMiniGrid() {
  const miniGrid = document.getElementById('mini-grid-container');
  if (!miniGrid) return;
  miniGrid.innerHTML = '';
  BUILD_TYPES.forEach(type => {
    const box = document.createElement('div');
    box.className = "mini-piece w-12 h-12 rounded-2xl flex items-center justify-center shadow-sm relative bg-white border-2 border-slate-200 hover:border-indigo-400 text-slate-300 transition-all";
    box.dataset.type = type;
    box.style.touchAction = "none";
    box.innerHTML = `<div class="w-8 h-8 flex items-center justify-center pointer-events-none">${getStrokeSVG(type, '#64748b', "6")}</div>`;
    box.addEventListener('pointerdown', e => startCustomDrag(e, type));
    miniGrid.appendChild(box);
  });
}

function populatePracticePalette() {
  const container = document.getElementById('practice-piece-container');
  if (!container) return;
  container.innerHTML = '';
  STROKE_TYPES.forEach(type => {
    const box = document.createElement('div');
    box.className = "mini-piece w-12 h-12 rounded-2xl flex items-center justify-center shadow-sm relative bg-white border-2 border-slate-200 hover:border-indigo-400 text-slate-300 transition-all";
    box.dataset.type = type;
    box.style.touchAction = "none";
    box.innerHTML = `<div class="w-8 h-8 flex items-center justify-center pointer-events-none">${getStrokeSVG(type, '#64748b', "6")}</div>`;
    box.addEventListener('pointerdown', e => startCustomDrag(e, type));
    container.appendChild(box);
  });
}

// Render Active Letter Blueprint with Smooth Fitting
function renderActiveLetter() {
  const letter = LETTERS[activeLetterIdx];
  const labelEl = document.getElementById('active-letter-lbl');
  if (labelEl) labelEl.innerText = letter;

  const space = document.getElementById('blueprint-space');
  if (!space) return;
  space.innerHTML = '';
  document.getElementById('letter-complete-stamp').style.opacity = '0';

  const blueprint = LETTER_BLUEPRINTS[letter] || [];
  blueprint.forEach(seg => {
    const isPlaced = !!placedBuildStrokes[seg.id];
    const color = isPlaced ? '#6366f1' : (traceGuideOn ? '#cbd5e1' : 'transparent');
    const slot = document.createElement('div');
    slot.id = `slot-${seg.id}`;
    slot.className = "guide-slot absolute pointer-events-none";
    slot.dataset.id = seg.id;
    slot.dataset.type = seg.type;

    if (seg.type.includes('curve')) {
      slot.style.left = seg.bx + '%';
      slot.style.top = seg.by + '%';
      slot.style.width = seg.bw + '%';
      slot.style.height = seg.bh + '%';
      slot.innerHTML = getStrokeSVG(seg.type, color, '12');
    } else {
      const g = lineGeom(seg);
      slot.style.left = g.midX + '%';
      slot.style.top = g.midY + '%';
      slot.style.width = g.len + '%';
      slot.style.height = '12px';
      slot.style.transform = `translate(-50%, -50%) rotate(${g.angle}deg)`;
      const bar = document.createElement('div');
      bar.className = 'seg-bar';
      bar.style.background = color;
      slot.appendChild(bar);
    }
    space.appendChild(slot);
  });

  populateMiniGrid();
}

function renderPracticeGrid() {
  const type = STROKE_TYPES[practiceTypeIdx];
  document.getElementById('active-practice-lbl').innerText = friendlyLabel(type);
  const container = document.getElementById('practice-grid-container');
  if (!container) return;
  container.innerHTML = '';

  for (let i = 0; i < 8; i++) {
    const isPlaced = !!placedPracticeCells[i];
    const cell = document.createElement('div');
    cell.id = `practice-cell-${i}`;
    cell.className = "practice-slot relative bg-white rounded-2xl border-2 border-slate-200 p-1 flex items-center justify-center shadow-sm aspect-square min-h-[48px] min-w-[48px] " + (isPlaced ? "bg-emerald-50 border-emerald-400" : "");
    cell.dataset.index = i;
    cell.dataset.type = type;

    const area = document.createElement('div');
    area.className = "pointer-events-none flex items-center justify-center w-full h-full p-1";
    area.innerHTML = `<div class="w-8 h-8">${getStrokeSVG(type, isPlaced ? '#10b981' : '#cbd5e1', "6")}</div>`;
    cell.appendChild(area);

    if (isPlaced) {
      const chk = document.createElement('div');
      chk.className = "absolute top-1 right-1.5 text-emerald-500 font-bold text-xs pointer-events-none";
      chk.innerText = "✓";
      cell.appendChild(chk);
    }
    container.appendChild(cell);
  }
}

// Section Switching with Sync
function switchSection(section, broadcast = true) {
  activeSection = section;
  ['tab-build', 'tab-practice', 'tab-canvas'].forEach(id => {
    document.getElementById(id).className = "px-3 py-1 rounded-lg text-slate-500 hover:text-slate-800 transition";
  });
  const activeTabBtn = document.getElementById(`tab-${section}`);
  if (activeTabBtn) activeTabBtn.className = "px-3 py-1 rounded-lg text-indigo-600 bg-white shadow-sm transition";

  document.getElementById('section-build').classList.toggle('hidden', section !== 'build');
  document.getElementById('section-practice').classList.toggle('hidden', section !== 'practice');
  document.getElementById('section-canvas').classList.toggle('hidden', section !== 'canvas');

  if (section === 'build') renderActiveLetter();
  if (section === 'practice') { renderPracticeGrid(); populatePracticePalette(); }
  if (section === 'canvas') initCanvasSection();

  if (broadcast) {
    sendUniversalAction('SWITCH_SECTION', { section });
  }
}

function toggleTraceMode(broadcast = true) {
  traceGuideOn = !traceGuideOn;
  const btn = document.getElementById('btn-toggle-trace');
  if (btn) {
    btn.innerText = traceGuideOn ? "🔍 Trace: ON" : "🔍 Trace: OFF";
    btn.className = "px-2.5 text-xs font-bold rounded-xl border shadow-sm h-8 transition " + (traceGuideOn ? "bg-indigo-600 text-white border-indigo-500" : "bg-white text-slate-600 border-slate-200");
  }
  renderActiveLetter();
  if (broadcast) {
    sendUniversalAction('TOGGLE_TRACE');
  }
}

function changeLetter(dir, broadcast = true) {
  activeLetterIdx = (activeLetterIdx + dir + LETTERS.length) % LETTERS.length;
  placedBuildStrokes = {};
  renderActiveLetter();
  if (broadcast) {
    sendUniversalAction('CHANGE_LETTER', { dir });
  }
}

function changePracticeType(dir, broadcast = true) {
  practiceTypeIdx = (practiceTypeIdx + dir + STROKE_TYPES.length) % STROKE_TYPES.length;
  placedPracticeCells = {};
  renderPracticeGrid();
  populatePracticePalette();
  if (broadcast) {
    sendUniversalAction('PRACTICE_CHANGE_TYPE', { dir });
  }
}

function resetActiveLetter(broadcast = true) {
  placedBuildStrokes = {};
  renderActiveLetter();
  if (broadcast) {
    sendUniversalAction('RESET_LETTER');
  }
}

function resetPracticeGrid(broadcast = true) {
  placedPracticeCells = {};
  renderPracticeGrid();
  if (broadcast) {
    sendUniversalAction('PRACTICE_RESET');
  }
}

// Drag & Drop Mechanics
let activeDragType = null, dragGhost = null;

function startCustomDrag(e, type) {
  initAudio();
  e.preventDefault();
  activeDragType = type;
  dragGhost = document.getElementById('drag-ghost');
  dragGhost.innerHTML = `<div class="w-10 h-10 flex items-center justify-center">${getStrokeSVG(type, '#6366f1', "8")}</div>`;
  dragGhost.className = "fixed pointer-events-none z-50 opacity-80 w-12 h-12 flex items-center justify-center";
  dragGhost.style.left = e.clientX + 'px';
  dragGhost.style.top = e.clientY + 'px';
  dragGhost.style.transform = `translate(-50%, -50%)`;
  dragGhost.classList.remove('hidden');

  window.addEventListener('pointermove', onCustomDragMove);
  window.addEventListener('pointerup', onCustomDragUp);
  window.addEventListener('pointercancel', onCustomDragUp);
}

function locateDropTarget(e, selector, isPlacedFn) {
  const els = document.querySelectorAll(selector);
  let best = null, bestDist = Infinity;
  els.forEach(el => {
    if (isPlacedFn(el)) return;
    const r = el.getBoundingClientRect();
    const centerX = r.left + r.width / 2;
    const centerY = r.top + r.height / 2;
    const dist = Math.hypot(e.clientX - centerX, e.clientY - centerY);
    const pad = 42;
    if (e.clientX >= r.left - pad && e.clientX <= r.right + pad && e.clientY >= r.top - pad && e.clientY <= r.bottom + pad) {
      if (dist < bestDist) {
        bestDist = dist;
        best = el;
      }
    }
  });
  return best;
}

function onCustomDragMove(e) {
  if (!dragGhost) return;
  dragGhost.style.left = e.clientX + 'px';
  dragGhost.style.top = e.clientY + 'px';

  document.querySelectorAll('.guide-slot,.practice-slot').forEach(s => s.classList.remove('hovered'));
  let target = null;
  if (activeSection === 'build') {
    target = locateDropTarget(e, '.guide-slot', el => placedBuildStrokes[el.dataset.id]);
  } else if (activeSection === 'practice') {
    target = locateDropTarget(e, '.practice-slot', el => placedPracticeCells[parseInt(el.dataset.index)]);
  }
  if (target && target.dataset.type === activeDragType) target.classList.add('hovered');
}

function onCustomDragUp(e) {
  window.removeEventListener('pointermove', onCustomDragMove);
  window.removeEventListener('pointerup', onCustomDragUp);
  window.removeEventListener('pointercancel', onCustomDragUp);

  if (!dragGhost) return;
  dragGhost.classList.add('hidden');
  dragGhost = null;

  let matched = false;
  if (activeSection === 'build') {
    const target = locateDropTarget(e, '.guide-slot', el => placedBuildStrokes[el.dataset.id]);
    if (target && target.dataset.type === activeDragType) {
      matched = true;
      placedBuildStrokes[target.dataset.id] = true;
      playSfxMatch();
      renderActiveLetter();
      checkBuildCompletion(true);
      sendUniversalAction('BUILD_LINE_PLACED', { strokeId: target.dataset.id, type: activeDragType });
    }
  } else if (activeSection === 'practice') {
    const target = locateDropTarget(e, '.practice-slot', el => placedPracticeCells[parseInt(el.dataset.index)]);
    if (target && target.dataset.type === activeDragType) {
      matched = true;
      const idx = parseInt(target.dataset.index);
      placedPracticeCells[idx] = true;
      playSfxPop();
      renderPracticeGrid();
      sendUniversalAction('PRACTICE_CELL_PLACED', { index: idx, type: activeDragType });
    }
  }

  if (!matched) playSfxWrong();
  activeDragType = null;
}

function checkBuildCompletion(withCeleb = true) {
  const letter = LETTERS[activeLetterIdx];
  const bp = LETTER_BLUEPRINTS[letter] || [];
  const done = bp.length > 0 && bp.every(s => placedBuildStrokes[s.id]);
  if (done) {
    document.getElementById('letter-complete-stamp').style.opacity = '1';
    if (withCeleb) {
      playSfxWin();
      startConfetti();
      setTimeout(() => {
        if (activeSection === 'build') changeLetter(1);
      }, 3000);
    }
  }
}

// Canvas Section Support
let canvas, ctx, rainbowOn = true, canvasTraceOn = true, hue = 0, drawing = false, lastPct = null;

function initCanvasSection() {
  canvas = document.getElementById('draw-canvas');
  if (!canvas) return;
  ctx = canvas.getContext('2d');
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
  renderCanvasTraceGuide();

  canvas.onpointerdown = e => {
    initAudio();
    const rect = canvas.getBoundingClientRect();
    drawing = true;
    lastPct = {
      x: ((e.clientX - rect.left) / rect.width) * 100,
      y: ((e.clientY - rect.top) / rect.height) * 100
    };
  };

  canvas.onpointermove = e => {
    if (!drawing || !lastPct) return;
    const rect = canvas.getBoundingClientRect();
    const curPct = {
      x: ((e.clientX - rect.left) / rect.width) * 100,
      y: ((e.clientY - rect.top) / rect.height) * 100
    };
    const color = rainbowOn ? `hsl(${(hue += 4) % 360},100%,50%)` : '#6366f1';
    ctx.strokeStyle = color;
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo((lastPct.x / 100) * canvas.width, (lastPct.y / 100) * canvas.height);
    ctx.lineTo((curPct.x / 100) * canvas.width, (curPct.y / 100) * canvas.height);
    ctx.stroke();

    sendUniversalAction('CANVAS_STROKE_DRAW', {
      x1: lastPct.x, y1: lastPct.y,
      x2: curPct.x, y2: curPct.y,
      color
    });
    lastPct = curPct;
  };

  window.addEventListener('pointerup', () => { drawing = false; lastPct = null; });
}

function renderCanvasTraceGuide() {
  const guide = document.getElementById('canvas-trace-guide');
  if (!guide) return;
  guide.innerHTML = '';
  if (!canvasTraceOn) return;
  const letter = LETTERS[activeLetterIdx];
  (LETTER_BLUEPRINTS[letter] || []).forEach(seg => {
    const el = document.createElement('div');
    el.className = "absolute pointer-events-none";
    if (seg.type.includes('curve')) {
      el.style.left = seg.bx + '%';
      el.style.top = seg.by + '%';
      el.style.width = seg.bw + '%';
      el.style.height = seg.bh + '%';
      el.innerHTML = getStrokeSVG(seg.type, '#334155', '12');
    } else {
      const g = lineGeom(seg);
      el.style.left = g.midX + '%';
      el.style.top = g.midY + '%';
      el.style.width = g.len + '%';
      el.style.height = '12px';
      el.style.transform = `translate(-50%, -50%) rotate(${g.angle}deg)`;
      el.style.background = '#334155';
      el.style.borderRadius = '999px';
    }
    guide.appendChild(el);
  });
}

function toggleRainbow() {
  rainbowOn = !rainbowOn;
  const btn = document.getElementById('btn-rainbow-toggle');
  if (btn) btn.innerText = rainbowOn ? "🌈 Rainbow" : "🖊️ Single Color";
}

function toggleCanvasTrace() {
  canvasTraceOn = !canvasTraceOn;
  const btn = document.getElementById('btn-canvas-trace-toggle');
  if (btn) btn.innerText = canvasTraceOn ? "🔍 Trace: ON" : "🔍 Trace: OFF";
  renderCanvasTraceGuide();
}

function clearCanvas(broadcast = true) {
  if (ctx && canvas) ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (broadcast) {
    sendUniversalAction('CANVAS_CLEAR');
  }
}

// Confetti Engine
function startConfetti() {
  const canvasC = document.getElementById('confetti-canvas');
  canvasC.width = window.innerWidth;
  canvasC.height = window.innerHeight;
  const c = canvasC.getContext('2d');
  const colors = ['#f43f5e', '#ec4899', '#a855f7', '#6366f1', '#3b82f6'];
  const particles = Array.from({ length: 65 }, () => ({
    x: Math.random() * canvasC.width,
    y: Math.random() * canvasC.height - canvasC.height,
    r: Math.random() * 5 + 3,
    d: Math.random() * canvasC.height,
    color: colors[Math.floor(Math.random() * colors.length)],
    tilt: Math.random() * 10 - 5,
    tai: Math.random() * 0.05 + 0.01,
    ta: 0
  }));
  const start = Date.now();
  function draw() {
    c.clearRect(0, 0, canvasC.width, canvasC.height);
    particles.forEach(p => {
      p.ta += p.tai;
      p.y += (Math.cos(p.d) + 2 + p.r / 2) / 2;
      p.x += Math.sin(p.ta);
      c.beginPath();
      c.lineWidth = p.r;
      c.strokeStyle = p.color;
      c.moveTo(p.x + p.tilt, p.y);
      c.lineTo(p.x, p.y + p.tilt);
      c.stroke();
    });
    if (Date.now() - start < 2400) requestAnimationFrame(draw);
    else c.clearRect(0, 0, canvasC.width, canvasC.height);
  }
  draw();
}

window.onload = function () {
  renderActiveLetter();
};
</script>
