<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phonics Worksheet — Blending Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF8EA;
    --sky:#6FC3E0;
    --sun:#FFC93C;
    --coral:#FF6F59;
    --leaf:#7AB852;
    --plum:#3D2C4E;
    --plum-soft:#6b5a7d;
    --danger:#E0554F;
    --purple:#9B7EDE;
    --card-shadow: 0 8px 0 rgba(61,44,78,0.15);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Nunito', sans-serif;
    background:var(--cream);
    color:var(--plum);
    min-height:100vh;
    padding-bottom:50px;
  }
  header{ text-align:center; padding:30px 20px 12px; }
  header h1{
    font-family:'Baloo 2', cursive;
    font-size:clamp(24px, 5vw, 38px);
    margin:0 0 6px;
    color:var(--coral);
  }
  header p{ margin:0; font-size:14px; color:var(--plum-soft); font-weight:700; }
  .wave{
    width:100%; height:34px;
    background: repeating-linear-gradient(115deg, var(--sky) 0 24px, var(--sun) 24px 48px);
    opacity:0.35;
    border-radius:0 0 50% 50%/0 0 100% 100%;
  }
  main{ max-width:820px; margin:0 auto; padding:16px; }

  .tabs{ display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
  .tab-btn{
    flex:1; min-width:100px;
    font-family:'Baloo 2', cursive; font-size:15px; font-weight:700;
    padding:10px 6px; border-radius:14px 14px 0 0;
    border:3px solid var(--plum); border-bottom:none;
    background:#efe7d4; color:var(--plum-soft); cursor:pointer;
  }
  .tab-btn.active{ background:#fff; color:var(--coral); }

  .panel{ display:none; }
  .panel.active{ display:block; }

  .word-picker{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:20px; }
  .word-chip{
    font-family:'Baloo 2', cursive; font-size:19px; font-weight:700;
    background:#fff; border:3px solid var(--plum); border-radius:14px;
    padding:8px 16px; cursor:pointer; box-shadow:0 4px 0 rgba(61,44,78,0.15);
  }
  .word-chip.active{ background:var(--coral); color:#fff; border-color:var(--coral); }
  .word-chip:active{ transform:translateY(3px); box-shadow:none; }
  .empty-note{ text-align:center; color:var(--plum-soft); font-weight:700; padding:20px; }

  .stage-progress{ display:flex; justify-content:center; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .stage-progress .step{
    flex:1; max-width:150px; text-align:center; padding:8px 6px;
    border-radius:12px; font-size:11px; font-weight:900;
    background:#fff; border:2px solid #e4dcc9; color:var(--plum-soft);
  }
  .stage-progress .step.active{ background:var(--sun); border-color:var(--sun); color:var(--plum); }
  .stage-progress .step.done{ background:var(--leaf); border-color:var(--leaf); color:#fff; }

  .stage-panel{
    background:#fff; border:4px solid var(--plum); border-radius:24px;
    box-shadow:var(--card-shadow); padding:28px 20px; text-align:center;
  }
  .stage-label{ font-family:'Baloo 2', cursive; font-size:21px; color:var(--coral); margin-bottom:6px; }
  .stage-sub{ font-size:14px; font-weight:700; color:var(--plum-soft); margin-bottom:22px; min-height:20px; }

  .letter-stage{ display:flex; align-items:center; justify-content:center; min-height:clamp(90px, 20vmin, 140px); margin-bottom:10px; }
  .letter-box{
    font-family:'Baloo 2', cursive; font-weight:800; color:var(--coral);
    background:#fdf3e2; border:4px solid var(--plum); border-radius:18px;
    width:clamp(64px, 18vmin, 100px); height:clamp(64px, 18vmin, 100px);
    font-size:clamp(32px, 9vmin, 62px);
    display:flex; align-items:center; justify-content:center;
    transition: margin .6s cubic-bezier(.34,1.56,.64,1), transform .6s ease;
  }
  .letter-box.blended{ background:var(--sun); transform:scale(1.08); }
  .gap-indicator{ transition:width .6s ease; }

  .word-result{
    font-family:'Baloo 2', cursive; font-size:clamp(26px, 6vmin, 40px); font-weight:800;
    color:var(--leaf); min-height:48px; margin:6px 0 16px;
  }

  .meaning-box{
    background:#f4f9ee; border:3px dashed var(--leaf); border-radius:16px;
    padding:14px; font-size:15px; font-weight:700; color:var(--plum); display:none;
  }
  .meaning-box.show{ display:block; }
  .meaning-box .word-highlight{ color:var(--coral); font-family:'Baloo 2', cursive; font-size:19px; }

  .stage-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:20px; }
  button.action{
    font-family:'Nunito'; font-weight:900; font-size:13px;
    border:3px solid var(--plum); background:#fff; color:var(--plum);
    padding:9px 18px; border-radius:14px; cursor:pointer; box-shadow:0 4px 0 rgba(61,44,78,0.2);
  }
  button.action:active{ transform:translateY(3px); box-shadow:none; }
  button.action.primary{ background:var(--coral); color:#fff; border-color:var(--coral); }
  button.action.sound{ background:var(--sun); border-color:var(--sun); }
  button.action.danger{ background:var(--danger); color:#fff; border-color:var(--danger); }
  button.action:disabled{ opacity:0.4; cursor:not-allowed; }

  .manage-form{
    background:#fff; border:4px solid var(--plum); border-radius:20px;
    padding:20px; box-shadow:var(--card-shadow); margin-bottom:20px;
  }
  .manage-form h3{ font-family:'Baloo 2', cursive; margin:0 0 14px; color:var(--plum); font-size:19px; }
  .form-row{ display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .form-row label{ display:block; font-size:12px; font-weight:900; color:var(--plum-soft); margin-bottom:4px; }
  .form-row input{
    width:100%; padding:9px 10px; border:2px solid #d8cfb8; border-radius:10px;
    font-family:'Nunito'; font-size:14px; font-weight:700; color:var(--plum);
  }
  .form-row .field{ flex:1; min-width:110px; }
  .form-row .field.small{ max-width:80px; }
  .form-actions{ display:flex; gap:10px; }
  .status-msg{ font-size:12px; font-weight:700; color:var(--leaf); min-height:16px; margin-top:6px; }
  .status-msg.error{ color:var(--danger); }

  .word-list{ display:flex; flex-direction:column; gap:8px; }
  .word-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:#fff; border:2px solid #e4dcc9; border-radius:12px; padding:10px 14px;
  }
  .word-row .wr-word{ font-family:'Baloo 2', cursive; font-size:18px; color:var(--coral); min-width:50px; }
  .word-row .wr-meaning{ flex:1; font-size:12px; color:var(--plum-soft); font-weight:700; }
  .word-row button{
    font-family:'Nunito'; font-weight:900; font-size:12px; border:2px solid var(--danger);
    background:#fff; color:var(--danger); padding:5px 10px; border-radius:8px; cursor:pointer;
  }
  .loading-msg{ text-align:center; color:var(--plum-soft); font-weight:700; padding:16px; }

  .build-instructions{
    background:#fff; border:3px solid var(--sky); border-radius:16px;
    padding:12px 16px; margin-bottom:18px; font-size:13px; font-weight:700; text-align:center;
  }
  .build-instructions .step-num{ color:var(--coral); }
  .letter-tray{
    display:flex; justify-content:center; gap:10px; flex-wrap:wrap;
    margin-bottom:22px; background:#fff; border:3px dashed var(--purple);
    border-radius:18px; padding:16px;
  }
  .onset-tile{
    font-family:'Baloo 2', cursive; font-weight:800; color:var(--plum);
    min-width:clamp(44px, 12vmin, 56px); height:clamp(44px, 12vmin, 56px);
    padding:0 12px; font-size:clamp(16px, 5vmin, 22px);
    display:flex; align-items:center; justify-content:center;
    background:var(--sun); border:3px solid var(--plum); border-radius:14px;
    cursor:pointer; transition: transform .15s ease, opacity .2s ease;
  }
  .onset-tile.selected{ background:var(--coral); color:#fff; transform:translateY(-6px) scale(1.08); }
  .onset-tile:active{ transform:scale(0.95); }
  .family-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:14px; }
  .family-col{
    background:#fff; border:4px solid var(--plum); border-radius:20px;
    box-shadow:var(--card-shadow); padding:14px 10px; text-align:center;
  }
  .family-col .col-header{
    font-family:'Baloo 2', cursive; font-size:clamp(18px, 5vmin, 24px); font-weight:800; color:#fff;
    border-radius:12px; padding:8px 0; margin-bottom:10px;
  }
  .family-col .drop-zone{
    min-height:52px; border:3px dashed #cbbfa0; border-radius:12px;
    display:flex; align-items:center; justify-content:center; margin-bottom:10px;
    font-family:'Baloo 2', cursive; font-size:14px; color:var(--plum-soft); font-weight:700;
    cursor:pointer; transition: background .15s ease;
  }
  .family-col .drop-zone.ready{ border-color:var(--coral); background:#fff4ee; }
  .family-col .drop-zone.wrong{ background:#fbdedd; border-color:var(--danger); animation: shake .35s; }
  .built-words{ display:flex; flex-direction:column; gap:6px; min-height:26px; }
  .built-word{
    font-family:'Baloo 2', cursive; font-size:16px; font-weight:800;
    background:#f4f9ee; border:2px solid var(--leaf); border-radius:10px;
    padding:5px 0; color:var(--leaf);
  }
  .col-progress{ font-size:11px; font-weight:900; color:var(--plum-soft); margin-top:8px; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-6px); }
    75%{ transform:translateX(6px); }
  }
  .celebrate-banner{
    text-align:center; font-family:'Baloo 2', cursive; font-size:22px;
    color:var(--leaf); min-height:32px; margin:16px 0 4px;
  }

  footer{ text-align:center; color:var(--plum-soft); font-size:12px; margin-top:24px; font-weight:700; }
</style>
</head>
<body>

<div class="wave"></div>
<header>
  <h1>Phonics Worksheet</h1>
  <p>Blending Practice — Group 1 + Group 2 Sounds</p>
  <p id="room-badge-display" style="font-size:11px; font-weight:900; color:var(--plum-soft); margin-top:4px; font-family:monospace;"></p>
</header>

<main>
  <div class="tabs">
    <button class="tab-btn active" id="tabPractice">Practice</button>
    <button class="tab-btn" id="tabBuild">Build Words</button>
    <button class="tab-btn" id="tabManage">Manage Words</button>
  </div>

  <!-- PRACTICE PANEL -->
  <div class="panel active" id="panelPractice">
    <div class="word-picker" id="wordPicker"></div>
    <div id="practiceArea"></div>
  </div>

  <!-- BUILD WORDS PANEL -->
  <div class="panel" id="panelBuild">
    <div class="build-instructions">
      Drag each word below up into the family column it belongs to.
    </div>
    <div id="buildContent">
      <div class="loading-msg">Loading word families...</div>
    </div>
    <div class="celebrate-banner" id="celebrateBanner"></div>
    <div style="text-align:center; margin-top:16px;">
      <button class="action primary" id="resetBuildBtn">Start Over</button>
    </div>
  </div>

  <!-- MANAGE PANEL -->
  <div class="panel" id="panelManage">
    <div class="manage-form">
      <h3>Add a New Word</h3>
      <div class="form-row">
        <div class="field small">
          <label>Letter 1</label>
          <input type="text" id="inputL1" maxlength="3" placeholder="a">
        </div>
        <div class="field small">
          <label>Letter 2</label>
          <input type="text" id="inputL2" maxlength="3" placeholder="t">
        </div>
        <div class="field">
          <label>Sentence (wrap the word in ** **)</label>
          <input type="text" id="inputMeaning" placeholder="I sat **at** the table.">
        </div>
      </div>
      <div class="form-actions">
        <button class="action primary" id="btnAddWord">Save Word</button>
      </div>
      <div class="status-msg" id="formStatus"></div>
    </div>

    <div class="manage-form">
      <h3>Your Word List</h3>
      <div class="word-list" id="wordListManage"></div>
    </div>

    <div class="manage-form">
      <h3>Add a Word to a Family (for Build Words game)</h3>
      <div class="form-row">
        <div class="field small">
          <label>Family Ending</label>
          <input type="text" id="inputFamilyEnding" maxlength="4" placeholder="at">
        </div>
        <div class="field small">
          <label>Full Word</label>
          <input type="text" id="inputFamilyWord" maxlength="10" placeholder="fat">
        </div>
      </div>
      <div class="form-actions">
        <button class="action primary" id="btnAddFamilyWord">Add to Family</button>
      </div>
      <div class="status-msg" id="familyFormStatus"></div>
    </div>

    <div class="manage-form">
      <h3>Your Word Families</h3>
      <div class="word-list" id="familyListManage"></div>
    </div>
  </div>
</main>

<footer>Sounds: s a t i p n · ck e h r m d</footer>

<script>
// ==========================================
// CONSOLE SYNC BRIDGE — standard LiveTutor protocol
// ==========================================
window.isSimulating = false;

let roomId = "default_room";
const hashParams = new URLSearchParams(window.location.hash.replace('#', '?'));
if (hashParams.has('room')) {
  roomId = hashParams.get('room');
}

// Seeded RNG — so any shuffle (e.g. the Build Words word-bank order)
// comes out identical on both tabs for the same room, without needing
// to sync the shuffle result over the network.
(function installSeededRNG() {
  let seed = 0;
  for (let i = 0; i < roomId.length; i++) {
    seed = (seed + roomId.charCodeAt(i)) | 0;
  }
  Math.random = function() {
    let t = seed += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
})();

function getUniqueSelector(el) {
  if (!el) return null;
  if (el.id) return '#' + el.id;
  if (el === document.body) return 'body';
  let path = [];
  while (el && el.nodeType === Node.ELEMENT_NODE) {
    let sel = el.nodeName.toLowerCase();
    if (el.id) { sel = '#' + el.id; path.unshift(sel); break; }
    let sib = el, nth = 1;
    while (sib = sib.previousElementSibling) {
      if (sib.nodeName.toLowerCase() === el.nodeName.toLowerCase()) nth++;
    }
    sel += ':nth-of-type(' + nth + ')';
    path.unshift(sel);
    el = el.parentNode;
  }
  return path.join(' > ');
}

// Generic outgoing sender for custom (non-click) sync actions, e.g. a
// successful drag-drop in the Build Words game.
function sendCustomAction(type, extra) {
  if (window.isSimulating) return;
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: 'IFRAME_ACTION_TRIGGERED',
      payload: Object.assign({ type: type }, extra)
    }, '*');
  }
}

// Outgoing: real user clicks -> console
document.addEventListener('click', function(e) {
  if (window.isSimulating) return;
  const clickTarget = e.target.closest('button, .word-chip, .tab-btn');
  if (!clickTarget) return;
  const selector = getUniqueSelector(clickTarget);
  if (!selector) return;
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: 'IFRAME_ACTION_TRIGGERED',
      payload: { type: 'UNIVERSAL_CLICK', selector: selector }
    }, '*');
  }
}, true);

// Outgoing: text typed in the Manage Words / Manage Families forms
document.addEventListener('input', function(e) {
  if (window.isSimulating) return;
  const el = e.target;
  if (!el.id) return;
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: 'IFRAME_ACTION_TRIGGERED',
      payload: { type: 'UNIVERSAL_INPUT', selector: '#' + el.id, value: el.value }
    }, '*');
  }
}, true);

// Incoming: console -> replay on this tab
function processReplayAction(action) {
  window.isSimulating = true;
  if (action.type === 'UNIVERSAL_CLICK') {
    const el = document.querySelector(action.selector);
    if (el) el.click();
  } else if (action.type === 'UNIVERSAL_INPUT') {
    const el = document.querySelector(action.selector);
    if (el) {
      el.value = action.value;
      el.dispatchEvent(new Event('input', { bubbles: true }));
    }
  } else if (action.type === 'FAMILY_DROP') {
    applyFamilyDrop(action.word, action.familyKey);
  }
  window.isSimulating = false;
}

window.addEventListener('message', function(event) {
  const data = event.data;
  if (!data) return;
  if (data.type === 'EXECUTE_UNIVERSAL_ACTION') {
    const action = data.action;
    if (!action) return;
    processReplayAction(action);
  }
});

/* ============ SHARED: SPEECH + CHIME ============ */
function speak(text, rate=0.85){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = rate;
  u.pitch = 1.05;
  window.speechSynthesis.speak(u);
}

let audioCtx = null;
function playChime(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    const notes = [523.25, 659.25, 783.99];
    notes.forEach((freq, i)=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const startTime = now + i * 0.09;
      gain.gain.setValueAtTime(0.0001, startTime);
      gain.gain.exponentialRampToValueAtTime(0.25, startTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(startTime);
      osc.stop(startTime + 0.3);
    });
  }catch(e){
    // audio not supported, silently skip
  }
}

/* ============ SHARED STORAGE (in-memory, session-only) ============ */
// window.storage removed — that API only exists inside Claude artifacts,
// not in a standalone file running inside the console's iframe.
const DEFAULT_WORDS = [
  { id:'at', l1:'a', l2:'t', meaning:'I am **at** school.' },
  { id:'an', l1:'a', l2:'n', meaning:'That is **an** ant.' },
  { id:'it', l1:'i', l2:'t', meaning:'**It** is a ball.' },
  { id:'in', l1:'i', l2:'n', meaning:'The pen is **in** the bag.' },
  { id:'is', l1:'i', l2:'s', meaning:'This **is** my book.' },
  { id:'as', l1:'a', l2:'s', meaning:'Run **as** fast **as** you can.' },
  { id:'he', l1:'h', l2:'e', meaning:'**He** is going to school.' },
  { id:'me', l1:'m', l2:'e', meaning:'Throw the ball to **me**.' },
  { id:'am', l1:'a', l2:'m', meaning:'I **am** happy.' }
];

let words = [];

function loadWords(){
  words = DEFAULT_WORDS.slice();
}

function saveWords(){
  // no-op: session-only storage
}

/* ============ TABS ============ */
const tabButtons = {
  practice: document.getElementById('tabPractice'),
  build: document.getElementById('tabBuild'),
  manage: document.getElementById('tabManage')
};
const panels = {
  practice: document.getElementById('panelPractice'),
  build: document.getElementById('panelBuild'),
  manage: document.getElementById('panelManage')
};
function switchTab(name){
  Object.keys(tabButtons).forEach(key=>{
    tabButtons[key].classList.toggle('active', key===name);
    panels[key].classList.toggle('active', key===name);
  });
  if(name==='manage'){ renderManageList(); renderFamilyListManage(); }
  if(name==='build') renderBuildTab();
}
tabButtons.practice.addEventListener('click', ()=> switchTab('practice'));
tabButtons.build.addEventListener('click', ()=> switchTab('build'));
tabButtons.manage.addEventListener('click', ()=> switchTab('manage'));

/* ============ PRACTICE TAB ============ */
let currentWordId = null;
let currentStage = 1;

const stageMeta = {
  1: { label:'Stage 1: Robot Voice', sub:'Say each sound separately with a long pause', gap:90 },
  2: { label:'Stage 2: Gap Reduced', sub:'Say the sounds again with a shorter pause', gap:38 },
  3: { label:'Stage 3: No Gap (Blend)', sub:'No pause — the sounds slide into one word', gap:6 },
  4: { label:'Stage 4: Meaning', sub:'Use the blended word in a sentence', gap:6 }
};

const wordPicker = document.getElementById('wordPicker');
const practiceArea = document.getElementById('practiceArea');

function renderWordPicker(){
  wordPicker.innerHTML = '';
  if(words.length === 0){
    wordPicker.innerHTML = '<div class="empty-note">No words yet. Add one in "Manage Words".</div>';
    practiceArea.innerHTML = '';
    return;
  }
  if(!words.find(w=>w.id===currentWordId)){
    currentWordId = words[0].id;
    currentStage = 1;
  }
  words.forEach(w=>{
    const chip = document.createElement('div');
    chip.id = 'word-chip-' + w.id;
    chip.className = 'word-chip' + (w.id===currentWordId ? ' active' : '');
    chip.textContent = w.l1 + w.l2;
    chip.addEventListener('click', ()=>{
      currentWordId = w.id;
      currentStage = 1;
      renderWordPicker();
      renderPracticeArea();
    });
    wordPicker.appendChild(chip);
  });
  renderPracticeArea();
}

function getCurrentWord(){
  return words.find(w=>w.id===currentWordId);
}

function renderPracticeArea(){
  const w = getCurrentWord();
  if(!w){ practiceArea.innerHTML = ''; return; }
  const meta = stageMeta[currentStage];

  practiceArea.innerHTML = `
    <div class="stage-progress" id="stageProgress"></div>
    <div class="stage-panel">
      <div class="stage-label">${meta.label}</div>
      <div class="stage-sub">${meta.sub}</div>
      <div class="letter-stage" id="letterStage"></div>
      <div class="word-result" id="wordResult"></div>
      <div class="meaning-box" id="meaningBox"></div>
      <div class="stage-actions">
        <button class="action sound" id="playStageSound">Hear Sound</button>
        <button class="action" id="prevStageBtn">Prev</button>
        <button class="action primary" id="nextStageBtn">Next</button>
      </div>
    </div>
  `;

  const stageProgress = document.getElementById('stageProgress');
  const stageNames = ['Robot','Gap Reduced','Blend','Meaning'];
  stageNames.forEach((name, i)=>{
    const step = document.createElement('div');
    step.className = 'step' + (i+1===currentStage ? ' active' : (i+1<currentStage ? ' done' : ''));
    step.textContent = name;
    stageProgress.appendChild(step);
  });

  const letterStage = document.getElementById('letterStage');
  const box1 = document.createElement('div');
  box1.className = 'letter-box';
  box1.textContent = w.l1;
  const gap = document.createElement('div');
  gap.className = 'gap-indicator';
  gap.style.width = meta.gap + 'px';
  const box2 = document.createElement('div');
  box2.className = 'letter-box';
  box2.textContent = w.l2;
  if(currentStage >= 3){ box1.classList.add('blended'); box2.classList.add('blended'); }
  letterStage.appendChild(box1);
  letterStage.appendChild(gap);
  letterStage.appendChild(box2);

  document.getElementById('wordResult').textContent = currentStage >= 3 ? (w.l1+w.l2).toUpperCase() : '';

  const meaningBox = document.getElementById('meaningBox');
  if(currentStage === 4){
    meaningBox.classList.add('show');
    meaningBox.innerHTML = w.meaning.replace(/\*\*(.*?)\*\*/g, '<span class="word-highlight">$1</span>');
  } else {
    meaningBox.classList.remove('show');
  }

  document.getElementById('prevStageBtn').disabled = currentStage===1;
  document.getElementById('nextStageBtn').textContent = currentStage===4 ? 'Next Word' : 'Next';

  document.getElementById('playStageSound').addEventListener('click', ()=>{
    if(currentStage===1){ speak(w.l1,0.6); setTimeout(()=>speak(w.l2,0.6), 1400); }
    else if(currentStage===2){ speak(w.l1,0.7); setTimeout(()=>speak(w.l2,0.7), 700); }
    else if(currentStage===3){ speak(w.l1+w.l2, 0.75); playChime(); }
    else if(currentStage===4){ speak(w.meaning.replace(/\*\*/g,''), 0.8); }
  });
  document.getElementById('prevStageBtn').addEventListener('click', ()=>{
    if(currentStage>1){ currentStage--; renderPracticeArea(); }
  });
  document.getElementById('nextStageBtn').addEventListener('click', ()=>{
    if(currentStage===3) playChime();
    if(currentStage<4){ currentStage++; }
    else {
      const idx = words.findIndex(x=>x.id===currentWordId);
      currentWordId = words[(idx+1)%words.length].id;
      currentStage = 1;
      renderWordPicker();
      return;
    }
    renderPracticeArea();
  });
}

/* ============ BUILD WORDS TAB ============ */
const FAMILY_DB = {
  at: { color:'#FF6F59', words:['sat','pat','hat','mat','rat'] },
  an: { color:'#6FC3E0', words:['pan','tan','ran','man'] },
  ap: { color:'#E0554F', words:['tap','nap','rap','sap'] },
  in: { color:'#7AB852', words:['pin','tin','sin','din'] },
  ip: { color:'#FFC93C', words:['sip','tip','nip','dip'] },
  it: { color:'#9B7EDE', words:['sit','pit','hit','nit'] }
};

let activeFamilies = {};
let sortedWordsPerFamily = {};
let wordBank = [];

const FAMILY_COLOR_PALETTE = ['#FF6F59','#6FC3E0','#7AB852','#FFC93C','#9B7EDE','#E0554F','#4FB0A5','#E38DC0'];

let customFamilyDB = {};

function loadCustomFamilyDB(){
  // in-memory only — nothing to load from disk/cloud, keep whatever is in customFamilyDB
}

function saveCustomFamilyDB(){
  // no-op: session-only storage
}

function buildFamiliesFromCustomDB(){
  const result = {};
  Object.keys(customFamilyDB).forEach((ending, idx)=>{
    const wordList = customFamilyDB[ending];
    if(!wordList || wordList.length === 0) return;
    const color = FAMILY_COLOR_PALETTE[idx % FAMILY_COLOR_PALETTE.length];
    result[ending] = { color, words: wordList.map(w => w.toLowerCase()) };
  });
  return result;
}

function loadFamiliesFromWords(){
  const customFamilies = buildFamiliesFromCustomDB();
  if(Object.keys(customFamilies).length > 0) return customFamilies;

  const endings = words.map(w => (w.l1 + w.l2).toLowerCase());
  const matched = {};
  endings.forEach(e=>{
    if(FAMILY_DB[e]) matched[e] = FAMILY_DB[e];
  });
  return Object.keys(matched).length >= 2 ? matched : FAMILY_DB;
}

function findFamilyForWord(word){
  return Object.keys(activeFamilies).find(key => word.endsWith(key));
}

function buildWordBank(families){
  const list = [];
  Object.values(families).forEach(fam=> list.push(...fam.words));
  // Uses Math.random() which is seeded per-room above, so both tabs
  // get the identical shuffled order without syncing it over the wire.
  for(let i = list.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list;
}

function renderBuildTab(){
  document.getElementById('buildContent').innerHTML = '<div class="loading-msg">Loading word families...</div>';
  loadCustomFamilyDB();
  activeFamilies = loadFamiliesFromWords();
  sortedWordsPerFamily = {};
  wordBank = buildWordBank(activeFamilies);
  document.getElementById('celebrateBanner').textContent = '';
  renderBuildContent();
}

function renderBuildContent(){
  const content = document.getElementById('buildContent');
  content.innerHTML = '';

  const trayLabel = document.createElement('div');
  trayLabel.className = 'col-progress';
  trayLabel.style.textAlign = 'center';
  trayLabel.style.marginBottom = '8px';
  trayLabel.textContent = 'WORD BANK — drag a word up to its family';
  content.appendChild(trayLabel);

  const tray = document.createElement('div');
  tray.className = 'letter-tray';
  tray.id = 'wordTray';
  content.appendChild(tray);

  const grid = document.createElement('div');
  grid.className = 'family-grid';
  grid.id = 'familyGrid';
  content.appendChild(grid);

  renderTray();
  renderFamilyGrid();
}

function renderTray(){
  const tray = document.getElementById('wordTray');
  tray.innerHTML = '';
  if(wordBank.length === 0){
    tray.innerHTML = '<div class="col-progress">Word bank is empty — all words sorted!</div>';
    return;
  }
  wordBank.forEach(word=>{
    const tile = document.createElement('div');
    tile.id = 'tile-' + word;
    tile.className = 'onset-tile';
    tile.textContent = word;
    tile.style.touchAction = 'none';
    attachDragHandlers(tile, word);
    tray.appendChild(tile);
  });
}

function renderFamilyGrid(){
  const grid = document.getElementById('familyGrid');
  grid.innerHTML = '';

  Object.keys(activeFamilies).forEach(key=>{
    const fam = activeFamilies[key];
    if(!sortedWordsPerFamily[key]) sortedWordsPerFamily[key] = new Set();

    const col = document.createElement('div');
    col.className = 'family-col';
    col.id = 'family-col-' + key;

    const headerEl = document.createElement('div');
    headerEl.className = 'col-header';
    headerEl.style.background = fam.color;
    headerEl.textContent = key;
    col.appendChild(headerEl);

    const dropZone = document.createElement('div');
    dropZone.className = 'drop-zone';
    dropZone.id = 'dropzone-' + key;
    dropZone.dataset.family = key;
    dropZone.textContent = 'drop here';
    col.appendChild(dropZone);

    const builtWrap = document.createElement('div');
    builtWrap.className = 'built-words';
    fam.words.forEach(word=>{
      if(sortedWordsPerFamily[key].has(word)){
        const chip = document.createElement('div');
        chip.className = 'built-word';
        chip.textContent = word;
        builtWrap.appendChild(chip);
      }
    });
    col.appendChild(builtWrap);

    const progress = document.createElement('div');
    progress.className = 'col-progress';
    progress.textContent = sortedWordsPerFamily[key].size + ' / ' + fam.words.length + ' sorted';
    col.appendChild(progress);

    grid.appendChild(col);
  });
}

// Applies a completed word->family sort. Used both for the real local
// drag-drop AND for a replayed FAMILY_DROP action from the other tab.
function applyFamilyDrop(word, familyKey){
  if(!activeFamilies[familyKey]) return;
  if(!sortedWordsPerFamily[familyKey]) sortedWordsPerFamily[familyKey] = new Set();
  sortedWordsPerFamily[familyKey].add(word);
  wordBank = wordBank.filter(w => w !== word);
  renderTray();
  renderFamilyGrid();
  checkCelebration();
}

/* ---- Real drag-and-drop using Pointer Events (works for mouse, touch, pen) ---- */
function attachDragHandlers(tile, word){
  tile.addEventListener('pointerdown', (e)=>{
    if (window.isSimulating) return; // don't let a replayed action re-trigger a local drag
    e.preventDefault();
    const rect = tile.getBoundingClientRect();

    const ghost = tile.cloneNode(true);
    ghost.style.position = 'fixed';
    ghost.style.left = rect.left + 'px';
    ghost.style.top = rect.top + 'px';
    ghost.style.width = rect.width + 'px';
    ghost.style.margin = '0';
    ghost.style.pointerEvents = 'none';
    ghost.style.zIndex = '9999';
    ghost.style.transform = 'scale(1.12)';
    ghost.style.boxShadow = '0 10px 18px rgba(61,44,78,0.35)';
    document.body.appendChild(ghost);

    tile.style.opacity = '0.25';

    const offsetX = e.clientX - rect.left;
    const offsetY = e.clientY - rect.top;

    function onMove(ev){
      ghost.style.left = (ev.clientX - offsetX) + 'px';
      ghost.style.top = (ev.clientY - offsetY) + 'px';
      document.querySelectorAll('.drop-zone').forEach(dz=> dz.classList.remove('ready'));
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      const dz = el && el.closest ? el.closest('.drop-zone') : null;
      if(dz) dz.classList.add('ready');
    }

    function onUp(ev){
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.querySelectorAll('.drop-zone').forEach(dz=> dz.classList.remove('ready'));
      ghost.remove();
      tile.style.opacity = '1';

      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      const dropZone = el && el.closest ? el.closest('.drop-zone') : null;
      if(!dropZone) return;

      const key = dropZone.dataset.family;
      const correctFamily = findFamilyForWord(word);

      if(correctFamily === key){
        playChime();
        speak(word, 0.75);
        applyFamilyDrop(word, key);
        // Only the final correct result is synced — not the drag motion —
        // same lightweight pattern as other drag-drop games in this system.
        sendCustomAction('FAMILY_DROP', { word: word, familyKey: key });
      } else {
        dropZone.classList.add('wrong');
        setTimeout(()=> dropZone.classList.remove('wrong'), 400);
      }
    }

    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });
}

function checkCelebration(){
  const totalWords = Object.values(activeFamilies).reduce((sum,f)=> sum + f.words.length, 0);
  const sortedWords = Object.values(sortedWordsPerFamily).reduce((sum,s)=> sum + s.size, 0);
  const banner = document.getElementById('celebrateBanner');
  if(sortedWords === totalWords && totalWords > 0){
    banner.textContent = 'All words sorted! Great job!';
    speak('Great job! You sorted all the words!', 0.85);
  } else {
    banner.textContent = '';
  }
}

document.getElementById('resetBuildBtn').addEventListener('click', renderBuildTab);

/* ============ MANAGE WORDS TAB ============ */
const formStatus = document.getElementById('formStatus');

document.getElementById('btnAddWord').addEventListener('click', ()=>{
  const l1 = document.getElementById('inputL1').value.trim().toLowerCase();
  const l2 = document.getElementById('inputL2').value.trim().toLowerCase();
  const meaning = document.getElementById('inputMeaning').value.trim();

  if(!l1 || !l2){
    formStatus.textContent = 'Please fill in both letters.';
    formStatus.classList.add('error');
    return;
  }
  if(!meaning){
    formStatus.textContent = 'Please add a sentence for meaning.';
    formStatus.classList.add('error');
    return;
  }

  const id = l1 + l2 + '-' + Date.now();
  words.push({ id, l1, l2, meaning });
  saveWords();
  formStatus.textContent = 'Word saved!';
  formStatus.classList.remove('error');
  document.getElementById('inputL1').value = '';
  document.getElementById('inputL2').value = '';
  document.getElementById('inputMeaning').value = '';
  renderManageList();
  renderWordPicker();
});

function renderManageList(){
  const list = document.getElementById('wordListManage');
  list.innerHTML = '';
  if(words.length===0){
    list.innerHTML = '<div class="empty-note">No words saved yet.</div>';
    return;
  }
  words.forEach(w=>{
    const row = document.createElement('div');
    row.className = 'word-row';
    row.innerHTML = `
      <div class="wr-word">${w.l1}${w.l2}</div>
      <div class="wr-meaning">${w.meaning.replace(/\*\*/g,'')}</div>
    `;
    const delBtn = document.createElement('button');
    delBtn.id = 'del-word-' + w.id;
    delBtn.textContent = 'Delete';
    delBtn.addEventListener('click', ()=>{
      words = words.filter(x=>x.id !== w.id);
      saveWords();
      renderManageList();
      renderWordPicker();
    });
    row.appendChild(delBtn);
    list.appendChild(row);
  });
}

/* ---- Manage Families (for Build Words game) ---- */
const familyFormStatus = document.getElementById('familyFormStatus');

document.getElementById('btnAddFamilyWord').addEventListener('click', ()=>{
  const ending = document.getElementById('inputFamilyEnding').value.trim().toLowerCase();
  const word = document.getElementById('inputFamilyWord').value.trim().toLowerCase();

  if(!ending){
    familyFormStatus.textContent = 'Please enter a family ending (e.g. at).';
    familyFormStatus.classList.add('error');
    return;
  }
  if(!word){
    familyFormStatus.textContent = 'Please enter a full word (e.g. fat).';
    familyFormStatus.classList.add('error');
    return;
  }
  if(!word.endsWith(ending)){
    familyFormStatus.textContent = 'The word must end with the family ending.';
    familyFormStatus.classList.add('error');
    return;
  }

  if(!customFamilyDB[ending]) customFamilyDB[ending] = [];
  if(!customFamilyDB[ending].includes(word)){
    customFamilyDB[ending].push(word);
  }
  saveCustomFamilyDB();

  familyFormStatus.textContent = 'Word added to "' + ending + '" family!';
  familyFormStatus.classList.remove('error');
  document.getElementById('inputFamilyEnding').value = '';
  document.getElementById('inputFamilyWord').value = '';
  renderFamilyListManage();
});

function renderFamilyListManage(){
  loadCustomFamilyDB();
  const list = document.getElementById('familyListManage');
  list.innerHTML = '';
  const endings = Object.keys(customFamilyDB).filter(e => customFamilyDB[e] && customFamilyDB[e].length > 0);
  if(endings.length === 0){
    list.innerHTML = '<div class="empty-note">No custom families yet. Add words above, or the Build Words game will use its default families.</div>';
    return;
  }
  endings.forEach(ending=>{
    customFamilyDB[ending].forEach(word=>{
      const row = document.createElement('div');
      row.className = 'word-row';
      row.innerHTML = `
        <div class="wr-word">${ending}</div>
        <div class="wr-meaning">${word}</div>
      `;
      const delBtn = document.createElement('button');
      delBtn.id = 'del-family-' + ending + '-' + word;
      delBtn.textContent = 'Delete';
      delBtn.addEventListener('click', ()=>{
        customFamilyDB[ending] = customFamilyDB[ending].filter(w => w !== word);
        if(customFamilyDB[ending].length === 0) delete customFamilyDB[ending];
        saveCustomFamilyDB();
        renderFamilyListManage();
      });
      row.appendChild(delBtn);
      list.appendChild(row);
    });
  });
}

  practiceArea.innerHTML = '<div class="loading-msg">Loading words...</div>';
