<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shadow Match Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    min-height: 100vh;
    background: radial-gradient(circle at top, #1e1b4b, #0f172a 100%);
    font-family: 'Fredoka', cursive, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 14px;
    overflow: hidden;
  }
  .card {
    background: rgba(255, 255, 255, 0.98);
    border-radius: 28px;
    padding: 24px;
    max-width: 820px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    text-align: center;
    position: relative;
    z-index: 10;
  }
  .title { font-size: 2rem; color: #4338ca; }
  .prompt { font-size: 1.2rem; color: #64748b; margin-top: 4px; margin-bottom: 14px; font-family: 'Nunito', sans-serif; font-weight: 800; }
  
  .question-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 18px;
  }
  .question-box {
    width: 170px;
    height: 170px;
    background: #ffffff;
    border: 5px solid #3b82f6;
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
    box-shadow: 0 10px 25px rgba(59, 130, 246, 0.25);
  }
  .question-box img, .question-box video {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .question-label {
    font-size: 1.4rem;
    color: #1e293b;
    font-weight: 800;
    margin-top: 8px;
  }

  .options-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    max-width: 480px;
    margin: 0 auto 18px auto;
  }
  .option-box {
    background: #22c55e;
    border: 5px solid #16a34a;
    border-radius: 20px;
    height: 145px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px;
    cursor: pointer;
    box-shadow: 0 6px 0 #15803d;
    transition: transform 0.15s, border-color 0.15s;
  }
  .option-box:active { transform: translateY(4px); box-shadow: 0 0 0 #15803d; }
  .option-box.correct { border-color: #3b82f6; background: #60a5fa; box-shadow: 0 6px 0 #2563eb; transform: scale(1.05); }
  .option-box.wrong { border-color: #ef4444; background: #fca5a5; box-shadow: 0 6px 0 #b91c1c; animation: shake 0.4s; }
  
  .option-box img, .option-box video {
    width: 100%;
    height: 85px;
    object-fit: contain;
    filter: brightness(0) invert(1) drop-shadow(0px 0px 1px white);
    pointer-events: none;
    transform: scale(0.9);
  }

  .option-label {
    font-size: 1.05rem;
    color: #ffffff;
    font-weight: 800;
    margin-top: 4px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.4);
  }

  @keyframes shake {
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-8px)}
    75%{transform:translateX(8px)}
  }

  .floating-emoji {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    animation: floatUp 1.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }
  @keyframes floatUp {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
    15% { opacity: 1; transform: translate(-50%, -70px) scale(1.4); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--rx)), -320px) scale(0.8) rotate(var(--rot)); }
  }

  .reaction-bar {
    display: flex;
    justify-content: center;
    gap: 12px;
    background: #f1f5f9;
    padding: 8px 16px;
    border-radius: 40px;
    width: fit-content;
    margin: 0 auto;
    border: 2px solid #cbd5e1;
  }
  .react-btn {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 50%;
    width: 42px;
    height: 42px;
    font-size: 1.3rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 3px 6px rgba(0,0,0,0.06);
    transition: transform 0.2s;
  }
  .react-btn:hover { transform: scale(1.25); }
</style>
</head>
<body>

  <div class="card" id="mainCard">
    <div class="title" id="wsTitle">Shadow Match</div>
    <div class="prompt" id="wsPrompt">Find the matching white shadow!</div>
    
    <div class="question-container" id="qContainer">
      <div class="question-box" id="questionBox"></div>
      <div class="question-label" id="questionLabel"></div>
    </div>

    <div class="options-grid" id="optionsGrid"></div>

    <div class="reaction-bar">
      <button class="react-btn" id="btn-choc" onclick="onReactionClick('🍫', '#btn-choc')">🍫</button>
      <button class="react-btn" id="btn-ice" onclick="onReactionClick('🍦', '#btn-ice')">🍦</button>
      <button class="react-btn" id="btn-star" onclick="onReactionClick('⭐', '#btn-star')">⭐</button>
      <button class="react-btn" id="btn-heart" onclick="onReactionClick('❤️', '#btn-heart')">❤️</button>
    </div>
  </div>

<script>
  let config = null;
  let queue = [];
  let currentTarget = null;
  window.isSimulating = false;

  const urlParams = new URLSearchParams(window.location.search || window.location.hash.replace('#', '?'));
  const roomId = urlParams.get('room') || '1000';

  let seed = 0;
  for (let i = 0; i < roomId.length; i++) seed += roomId.charCodeAt(i);
  function rand() {
    let x = Math.sin(seed++) * 10000;
    return x - Math.floor(x);
  }
  function shuffle(arr) {
    let a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function playSound(type) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = (type === 'bad') ? 'sawtooth' : 'sine';
      let freq = (type === 'bad') ? 160 : (type === 'chime' ? 880 : 587);
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.35);
    } catch (e) {}
  }

  function popFloatingEmoji(emoji) {
    playSound('chime');
    for (let i = 0; i < 5; i++) {
      const span = document.createElement('span');
      span.className = 'floating-emoji';
      span.innerText = emoji;
      span.style.fontSize = (Math.random() * 18 + 28) + 'px';
      span.style.left = (window.innerWidth / 2 + (Math.random() * 120 - 60)) + 'px';
      span.style.top = (window.innerHeight / 2 + (Math.random() * 60 - 30)) + 'px';
      span.style.setProperty('--rx', (Math.random() * 180 - 90) + 'px');
      span.style.setProperty('--rot', (Math.random() * 60 - 30) + 'deg');
      document.body.appendChild(span);
      setTimeout(() => span.remove(), 1600);
    }
  }

  function onReactionClick(emoji, selector) {
    if (!window.isSimulating) {
      window.parent.postMessage({
        type: 'IFRAME_ACTION_TRIGGERED',
        payload: { type: 'UNIVERSAL_CLICK', selector }
      }, '*');
    }
    popFloatingEmoji(emoji);
  }

  window.addEventListener('message', ev => {
    if (!ev.data) return;
    if (ev.data.type === 'EXECUTE_UNIVERSAL_ACTION') {
      const act = ev.data.action;
      if (!act) return;
      window.isSimulating = true;
      if (act.type === 'UNIVERSAL_CLICK' && act.selector) {
        const el = document.querySelector(act.selector);
        if (el) el.click();
      }
      setTimeout(() => { window.isSimulating = false; }, 40);
    }
  });

  document.addEventListener('mousemove', e => {
    const card = document.getElementById('mainCard');
    if (!card || window.isSimulating) return;
    const rect = card.getBoundingClientRect();
    const pctX = ((e.clientX - rect.left) / rect.width) * 100;
    const pctY = ((e.clientY - rect.top) / rect.height) * 100;
    if (pctX >= 0 && pctX <= 100 && pctY >= 0 && pctY <= 100) {
      window.parent.postMessage({
        type: 'IFRAME_MOUSE_TRACK',
        payload: { pctX, pctY }
      }, '*');
    }
  });

  fetch('worksheet.json')
    .then(r => r.json())
    .then(data => {
      config = data;
      document.getElementById('wsTitle').innerText = config.title || 'Shadow Match';
      const validItems = config.items.filter(it => it.path && it.path.trim() !== '');
      queue = shuffle(validItems);
      loadQuestion();
    })
    .catch(() => {
      document.getElementById('wsPrompt').innerText = 'worksheet.json not found!';
    });

  function loadQuestion() {
    if (!queue.length) {
      document.getElementById('wsPrompt').innerText = '🎉 Fantastic Job! Completed.';
      document.getElementById('qContainer').style.display = 'none';
      document.getElementById('optionsGrid').innerHTML = '<button onclick="location.reload()" style="grid-column: span 2; padding: 12px; font-weight:800; border-radius:14px; background:#4338ca; color:#fff; border:none; cursor:pointer; font-size:1.1rem;">Play Again</button>';
      popFloatingEmoji('⭐');
      return;
    }

    currentTarget = queue.pop();

    const qBox = document.getElementById('questionBox');
    const isVid = currentTarget.path.endsWith('.mp4') || currentTarget.path.endsWith('.webm');
    qBox.innerHTML = isVid
      ? `<video src="${currentTarget.path}" autoplay loop muted></video>`
      : `<img src="${currentTarget.path}">`;

    document.getElementById('questionLabel').innerText = currentTarget.label || '';

    const validItems = config.items.filter(it => it.path && it.path.trim() !== '');
    const others = validItems.filter(it => it.path !== currentTarget.path);
    const wrongs = shuffle(others).slice(0, 3);

    const choices = shuffle([currentTarget, ...wrongs]);

    const grid = document.getElementById('optionsGrid');
    grid.innerHTML = '';

    choices.forEach((choice, idx) => {
      const box = document.createElement('div');
      box.className = 'option-box';
      box.id = 'opt-btn-' + idx;

      const choiceIsVid = choice.path.endsWith('.mp4') || choice.path.endsWith('.webm');
      box.innerHTML = choiceIsVid
        ? `<video src="${choice.path}" autoplay loop muted></video><div class="option-label">${choice.label || ''}</div>`
        : `<img src="${choice.path}"><div class="option-label">${choice.label || ''}</div>`;

      box.onclick = () => {
        if (!window.isSimulating) {
          window.parent.postMessage({
            type: 'IFRAME_ACTION_TRIGGERED',
            payload: { type: 'UNIVERSAL_CLICK', selector: '#opt-btn-' + idx }
          }, '*');
        }

        if (choice.path === currentTarget.path) {
          box.classList.add('correct');
          playSound('win');
          popFloatingEmoji('⭐');
          setTimeout(() => loadQuestion(), 1200);
        } else {
          box.classList.add('wrong');
          playSound('bad');
          setTimeout(() => box.classList.remove('wrong'), 450);
        }
      };

      grid.appendChild(box);
    });
  }
</script>
</body>
</html>
